[project]
name = "bijou-voice"
version = "0.1.0"
description = "Bijou Voice concierge — Telnyx-backed voice AI with shared context"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "W3J Bijou AI" }
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
