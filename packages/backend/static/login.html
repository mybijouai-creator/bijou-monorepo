<!doctype html>
<html lang="en">
  <!-- edge-cache-bust:v=2026-07-28a -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In to Bijou AI</title>
    <link rel="icon" type="image/svg+xml" href="/static/bijou-logo.svg" />
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Base styling with official Bijou AI Identity Mark colors */
      body {
        background: #0a1e1c;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* Subtle radial glow behind card — matches logo glow */
      body::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(46, 241, 157, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      .login-card {
        background: #0a1e1c;
        border: 2px solid #c9a961; /* Gold border — matches logo ring */
        border-radius: 16px;
        padding: 48px 40px;
        width: 440px;
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.6),
          0 0 80px rgba(46, 241, 157, 0.08);
        position: relative;
        z-index: 1;
      }

      .logo-img {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        display: block;
      }

      h1 {
        color: #e8d4a0; /* Pale Gold — premium headline */
        font-size: 26px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        text-shadow: 0 0 10px rgba(232, 212, 160, 0.3);
      }

      .subtitle {
        color: #d0d0d0;
        font-size: 14px;
        text-align: center;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      label {
        color: #e8d4a0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      input[type="email"] {
        width: 100%;
        background: #053b35;
        border: 1px solid rgba(201, 169, 97, 0.35);
        color: #ffffff;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-family: "Inter", sans-serif;
        transition: all 0.2s ease;
      }

      input[type="email"]:focus {
        border-color: #2ef19d;
        outline: none;
        box-shadow: 0 0 0 3px rgba(46, 241, 157, 0.1);
        background: #064540;
      }

      input[type="email"]::placeholder {
        color: rgba(208, 208, 208, 0.6);
      }

      .btn-primary {
        width: 100%;
        background: linear-gradient(135deg, #2ef19d 0%, #00f5e4 100%);
        border: 2px solid #c9a961;
        color: #0a1e1c;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 16px;
        padding: 14px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(46, 241, 157, 0.25);
        transition: all 0.2s ease;
        margin-top: 20px;
        text-transform: none;
      }

      .btn-primary:hover {
        box-shadow: 0 6px 28px rgba(46, 241, 157, 0.4);
        transform: translateY(-1px);
        background: linear-gradient(135deg, #00f5e4 0%, #2ef19d 100%);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        background: linear-gradient(135deg, #2ef19d 0%, #00f5e4 100%);
      }

      .status-message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
        text-align: left;
        display: none;
        border: 1px solid transparent;
      }

      .status-message.success {
        background: rgba(46, 241, 157, 0.1);
        color: #2ef19d;
        border-color: rgba(46, 241, 157, 0.3);
        display: block;
      }

      .status-message.error {
        background: rgba(255, 67, 67, 0.1);
        color: #ff6b6b;
        border-color: rgba(255, 67, 67, 0.3);
        display: block;
      }

      .status-message.info {
        background: rgba(201, 169, 97, 0.1);
        color: #c9a961;
        border-color: rgba(201, 169, 97, 0.3);
        display: block;
      }

      .loader {
        border: 3px solid rgba(46, 241, 157, 0.3);
        border-top: 3px solid #2ef19d;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-left: 10px;
        vertical-align: middle;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .divider {
        height: 1px;
        background: rgba(201, 169, 97, 0.2);
        margin: 24px 0;
        border: none;
      }

      .signup-link {
        color: #d0d0d0;
        font-size: 14px;
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid rgba(201, 169, 97, 0.15);
      }

      .signup-link a {
        color: #2ef19d;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .signup-link a:hover {
        color: #00f5e4;
        text-decoration: underline;
      }

      .forgot-password-link {
        display: block;
        text-align: right;
        margin-top: 8px;
        margin-bottom: -8px;
      }

      .forgot-password-link a {
        color: #c9a961;
        font-size: 13px;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .forgot-password-link a:hover {
        color: #2ef19d;
        text-decoration: underline;
      }

      .recovery-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .recovery-modal.active {
        display: flex;
      }

      .recovery-card {
        background: #0a1e1c;
        border: 2px solid #c9a961;
        border-radius: 12px;
        padding: 32px;
        width: 90%;
        max-width: 440px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      }

      .recovery-card h2 {
        color: #e8d4a0;
        font-size: 22px;
        margin-bottom: 12px;
      }

      .recovery-card p {
        color: #d0d0d0;
        font-size: 14px;
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(201, 169, 97, 0.5);
        color: #c9a961;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-right: 10px;
      }

      .btn-secondary:hover {
        background: rgba(201, 169, 97, 0.1);
        border-color: #c9a961;
      }

      .recovery-buttons {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
      }

      /* Mobile responsiveness */
      @media (max-width: 480px) {
        .login-card {
          padding: 32px 24px;
          width: 100%;
          max-width: 400px;
        }

        h1 {
          font-size: 22px;
        }

        .logo-img {
          width: 70px;
          height: 70px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <img
        src="/static/logos/mark.svg"
        alt="Bijou AI"
        class="logo-img"
      />
      <h1>Welcome Back to Bijou AI</h1>
      <p class="subtitle">Sign in with your email and password</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-top: 20px">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
            style="
              width: 100%;
              background: #053b35;
              border: 1px solid rgba(201, 169, 97, 0.35);
              color: #ffffff;
              border-radius: 8px;
              padding: 12px 16px;
              font-size: 15px;
              font-family: &quot;Inter&quot;, sans-serif;
              transition: all 0.2s ease;
            "
          />
        </div>

        <div class="forgot-password-link">
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin:4px 0 8px;">
          <input type="checkbox" id="rememberMe" style="width:16px;height:16px;accent-color:#10b981;cursor:pointer;">
          <label for="rememberMe" style="color:#9ca3af;font-size:13px;cursor:pointer;user-select:none;">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          Sign In
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:18px 0;">
        <span style="flex:1;height:1px;background:rgba(201,169,97,0.25);"></span>
        <span style="color:#9ca3af;font-size:12px;">or</span>
        <span style="flex:1;height:1px;background:rgba(201,169,97,0.25);"></span>
      </div>

      <button type="button" id="googleSignInBtn"
        style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:none;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Sign in with Google
      </button>

      <div id="statusMessage" class="status-message"></div>

      <div class="signup-link">
        Don't have an account?
        <a href="/signup">Sign up here</a>
      </div>
    </div>

    <!-- Password Recovery Modal -->
    <div id="recoveryModal" class="recovery-modal">
      <div class="recovery-card">
        <h2>Reset Your Password</h2>
        <p>
          Enter your email address and we'll send you a password reset link.
        </p>

        <div class="form-group">
          <label for="recoveryEmail">Email Address</label>
          <input
            type="email"
            id="recoveryEmail"
            placeholder="your@email.com"
            style="
              width: 100%;
              background: #053b35;
              border: 1px solid rgba(201, 169, 97, 0.35);
              color: #ffffff;
              border-radius: 8px;
              padding: 12px 16px;
              font-size: 15px;
              font-family: &quot;Inter&quot;, sans-serif;
            "
          />
        </div>

        <div id="recoveryStatus" class="status-message"></div>

        <div class="recovery-buttons">
          <button type="button" class="btn-secondary" id="cancelRecoveryBtn">
            Cancel
          </button>
          <button
            type="button"
            class="btn-primary"
            id="sendRecoveryBtn"
            style="width: auto; margin-top: 0"
          >
            Send Reset Link
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitBtn = document.getElementById("submitBtn");
      const statusMessage = document.getElementById("statusMessage");

      // --- Supabase client for "Sign in with Google" (anon key is public/safe) ---
      const SUPABASE_URL = "https://lrwzlujomukzjykafmic.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxyd3psdWpvbXVremp5a2FmbWljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzA2ODMsImV4cCI6MjA4NDY0NjY4M30.ZJSvmh0Oa_51rfr0TrTSjS4OdszrUCe5Fmsnfk9X-6U";
      const sb =
        window.supabase &&
        window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const googleBtn = document.getElementById("googleSignInBtn");
      if (googleBtn) {
        googleBtn.addEventListener("click", async () => {
          if (!sb) {
            showMessage("error", "Auth library failed to load. Refresh and try again.");
            return;
          }
          const { error } = await sb.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: window.location.origin + "/static/auth-callback.html" },
          });
          if (error) showMessage("error", "Google sign-in failed: " + error.message);
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Hard guard against double-submit. JS-level lock so a double-click
        // before submitBtn.disabled takes effect doesn't fire two POSTs.
        if (window.__loginInFlight) return;
        window.__loginInFlight = true;

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("error", "Please enter both email and password.");
          window.__loginInFlight = false;
          return;
        }

        // Disable form during submission
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Signing in... <span class="loader"></span>';
        statusMessage.style.display = "none";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            // Store tokens. The `|| ""` fallbacks mirror auth-callback.html
            // (the Google sign-in path) so a missing field on the response
            // doesn't store the literal string "undefined" in localStorage —
            // which the dashboard would then read back and display. 2026-08-17.
            localStorage.setItem("access_token", data.access_token || "");
            localStorage.setItem("refresh_token", data.refresh_token || "");
            localStorage.setItem("tenant_id", data.tenant_id || "");
            localStorage.setItem("business_name", data.business_name || "");
            localStorage.setItem("email", data.email || "");
            // Remember me: persist flag + login timestamp
            const rememberMe = document.getElementById("rememberMe")?.checked || false;
            localStorage.setItem("session_remember_me", rememberMe ? "true" : "false");
            localStorage.setItem("session_login_at", Date.now().toString());

            // Success
            showMessage(
              "success",
              "✅ Login successful! Redirecting to dashboard...",
            );

            // Redirect to dashboard
            setTimeout(() => {
              window.location.href = "/dashboard";
            }, 1000);
          } else {
            // Error from backend. Same formatApiError helper as signup.html
            // so 422 validation arrays render as a readable string instead of
            // "[object Object]". Mirror of the pattern in signup.html.
            const detail = formatApiError(data);
            const safeDetail = /^[A-Z][A-Za-z0-9_.]*$/.test(detail) ? "" : detail;
            const statusHint = {
              400: "Please check the form and try again.",
              401: "❌ Invalid email or password. Please try again.",
              404: "❌ No account found with that email. Please sign up first.",
              422: "Some required fields are missing or invalid.",
              429: "You're trying too often. Please wait a minute and try again.",
              500: "Our server had a hiccup. Please try again, and if it keeps happening, contact support.",
              503: "The login service is temporarily unreachable. Please try again in a moment.",
            }[response.status] || "Login failed. Please try again.";
            const msg = safeDetail && safeDetail !== statusHint
              ? `${statusHint}\n\nDetails: ${safeDetail}`
              : statusHint;
            showMessage("error", msg);
          }
        } catch (error) {
          console.error("Login error:", error);
          showMessage(
            "error",
            "❌ Network error. Please check your connection and try again.",
          );
        } finally {
          // Re-enable form
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Sign In";
          // Release the JS-level lock so the user can retry.
          // (On 2xx success the redirect fires within 1s, so this also
          // runs after navigation, but that's fine — the user is already
          // on /dashboard by then.)
          window.__loginInFlight = false;
        }
      });

      function showMessage(type, message) {
        statusMessage.className = `status-message ${type}`;
        statusMessage.innerHTML = message.replace(/\n/g, "<br>");
        statusMessage.style.display = "block";
      }

      // Translate FastAPI's `data.detail` into a user-readable string.
      // FastAPI returns:
      //   - string for HTTPException (e.g. "Invalid email or password")
      //   - ARRAY for Pydantic 422 validation (e.g. [{type, loc, msg}, ...])
      // We flatten all of these to the first human-readable message.
      function formatApiError(data) {
        if (!data) return "Unknown error. Please try again.";
        const d = data.detail;
        if (typeof d === "string") return d;
        if (Array.isArray(d) && d.length) {
          const first = d[0];
          if (first && typeof first === "object" && first.msg) {
            const field = Array.isArray(first.loc) ? first.loc.slice(1).join(".") : "";
            return field
              ? `${field}: ${first.msg}`
              : first.msg;
          }
          if (typeof first === "string") return first;
        }
        return "Login failed. Please try again.";
      }

      // Password Recovery Modal
      const forgotPasswordLink = document.getElementById("forgotPasswordLink");
      const recoveryModal = document.getElementById("recoveryModal");
      const recoveryEmailInput = document.getElementById("recoveryEmail");
      const sendRecoveryBtn = document.getElementById("sendRecoveryBtn");
      const cancelRecoveryBtn = document.getElementById("cancelRecoveryBtn");
      const recoveryStatus = document.getElementById("recoveryStatus");

      forgotPasswordLink.addEventListener("click", (e) => {
        e.preventDefault();
        recoveryModal.classList.add("active");
        recoveryEmailInput.value = emailInput.value; // Pre-fill with login email
        recoveryStatus.style.display = "none";
      });

      cancelRecoveryBtn.addEventListener("click", () => {
        recoveryModal.classList.remove("active");
        recoveryEmailInput.value = "";
        recoveryStatus.style.display = "none";
      });

      sendRecoveryBtn.addEventListener("click", async () => {
        const email = recoveryEmailInput.value.trim();

        if (!email) {
          showRecoveryMessage("error", "Please enter your email address.");
          return;
        }

        sendRecoveryBtn.disabled = true;
        sendRecoveryBtn.innerHTML = 'Sending... <span class="loader"></span>';

        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (response.ok) {
            showRecoveryMessage(
              "success",
              "✅ Password reset link sent! Check your email inbox.",
            );

            setTimeout(() => {
              recoveryModal.classList.remove("active");
              recoveryEmailInput.value = "";
              recoveryStatus.style.display = "none";
            }, 3000);
          } else {
            showRecoveryMessage(
              "error",
              data.detail || "Failed to send reset link. Please try again.",
            );
          }
        } catch (error) {
          console.error("Password recovery error:", error);
          showRecoveryMessage(
            "error",
            "Network error. Please check your connection.",
          );
        } finally {
          sendRecoveryBtn.disabled = false;
          sendRecoveryBtn.innerHTML = "Send Reset Link";
        }
      });

      function showRecoveryMessage(type, message) {
        recoveryStatus.className = `status-message ${type}`;
        recoveryStatus.innerHTML = message;
        recoveryStatus.style.display = "block";
      }

      // Close modal on outside click
      recoveryModal.addEventListener("click", (e) => {
        if (e.target === recoveryModal) {
          recoveryModal.classList.remove("active");
          recoveryEmailInput.value = "";
          recoveryStatus.style.display = "none";
        }
      });
    </script>
  </body>
</html>
