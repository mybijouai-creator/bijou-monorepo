    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useCallback, useRef } = React;

      // ── Display helpers ──────────────────────────────────────────────────────────
      function displayName(c) {
        if (!c) return "Unknown";
        const name = c.contact_name || c.customer_name;
        const jid = c.chat_jid || c.customer_jid || "";
        // Accept name if it doesn't look like a raw JID (no @) — phone numbers with + are fine
        if (name && !name.includes("@")) return name;
        // For @lid JIDs there's no embedded phone — show last 6 digits as identifier
        if (jid.endsWith("@lid")) {
          const digits = jid.replace("@lid", "");
          return "Customer \u2026" + digits.slice(-6);
        }
        if (jid.endsWith("@g.us")) return "Group \u2026" + jid.slice(0, 8);
        // Standard JIDs: phone number before @
        const phone = jid.split("@")[0];
        return phone ? "+" + phone : "Unknown";
      }

      // ── CRM tag colours (global so InboxModule can also use them) ────────────────
      const TAG_COLORS = {
        lead: "#10b981",
        inquiry: "#3b82f6",
        hot_lead: "#f59e0b",
        warm: "#f59e0b",      // legacy alias → same amber as hot_lead
        hot: "#ef4444",       // legacy alias → red for urgent
        qualified: "#8b5cf6", // legacy alias → purple
        customer: "#8b5cf6",
        vip: "#ec4899",
        blocked: "#ef4444",
      };

      // ── Auth (Dual: JWT + Magic Link) ───────────────────────────────────────────
      const params = new URLSearchParams(window.location.search);

      // Self-healing: ?reset=1 clears stale localStorage and forces a clean re-login.
      // Fixes the "Disconnected" stuck state when access_token is malformed or refresh_token is invalid.
      if (params.get("reset") === "1") {
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        // Use replace() so the back button can't return to the stale state.
        window.location.replace("/login?reason=session_reset");
        // Halt execution; the navigation will unload this script.
        throw new Error("session_reset");
      }

      // Try localStorage first (JWT auth), fall back to URL params (magic link)
      let TENANT_ID = localStorage.getItem("tenant_id") || params.get("tenant_id") || params.get("tenantId") || "";
      // Business identity (captured at login) — used across the shell instead of raw Tenant-ID/UUID.
      const BUSINESS_NAME = (localStorage.getItem("business_name") || "").trim();
      const BUSINESS_INITIAL = (BUSINESS_NAME || "Bijou").trim().charAt(0).toUpperCase();
      // The magic-link token comes from a signup email/WhatsApp deep link.
      // Do NOT fall back to TENANT_ID here: the tenant UUID is not a
      // valid `signup_token`, so `useMagicLink` would send `?token=<UUID>`
      // and the backend would 401 every call.
      let TOKEN = params.get("token") || "";
      const ACCESS_TOKEN = localStorage.getItem("access_token");
      const REFRESH_TOKEN = localStorage.getItem("refresh_token");

      // ── Session helpers (always read fresh from localStorage after refresh) ──────
      const getAccessToken = () => localStorage.getItem("access_token");
      const getRefreshToken = () => localStorage.getItem("refresh_token");

      // 2026-08-10 FIX: five fetch() calls bypassed api() and authenticated via
      // ?token=${TOKEN}. TOKEN is "" for every JWT-logged-in user, so those
      // calls 401'd every time — media upload, media metadata, contacts
      // import/export and KB file upload were all permanently broken.
      // One helper so a sixth call site cannot repeat it. Deliberately omits
      // Content-Type: FormData must set its own multipart boundary.
      const authHeaders = (extra = {}) => {
        const t = getAccessToken();
        return {
          "X-Tenant-ID": TENANT_ID,
          ...(t ? { Authorization: `Bearer ${t}` } : {}),
          ...extra,
        };
      };
      const REMEMBER_ME = localStorage.getItem("session_remember_me") === "true";

      // ── Auto-refresh: exchange refresh_token for new access_token on 401 ─────────
      let _refreshPromise = null;
      async function tryRefreshTokenOnce() {
        if (_refreshPromise) return _refreshPromise;
        _refreshPromise = (async () => {
          const rt = getRefreshToken();
          if (!rt) return false;
          try {
            const res = await fetch("/api/auth/refresh", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ refresh_token: rt }),
            });
            if (!res.ok) return false;
            const data = await res.json();
            localStorage.setItem("access_token", data.access_token);
            if (data.refresh_token) localStorage.setItem("refresh_token", data.refresh_token);
            return true;
          } catch { return false; }
          finally { _refreshPromise = null; }
        })();
        return _refreshPromise;
      }

      // ── Inactivity auto-logout (skip when Remember Me is on) ─────────────────────
      const INACTIVITY_MS = 30 * 60 * 1000;  // 30 minutes
      const WARN_MS       = 25 * 60 * 1000;  // warn at 25 minutes
      let _inactivityTimer = null;
      let _warnTimer = null;
      function throttle(fn, ms) {
        let last = 0;
        return function(...args) {
          const now = Date.now();
          if (now - last >= ms) { last = now; fn.apply(this, args); }
        };
      }
      function resetInactivityTimer() {
        if (REMEMBER_ME) return;
        localStorage.setItem("last_activity", Date.now().toString());
        clearTimeout(_inactivityTimer);
        clearTimeout(_warnTimer);
        _warnTimer = setTimeout(() => {
          if (typeof showToast === "function")
            showToast("⚠️ You'll be logged out in 5 minutes due to inactivity. Move the mouse to stay in.", "warning");
        }, WARN_MS);
        _inactivityTimer = setTimeout(() => {
          try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
          window.location.replace("/login?reason=inactive");
        }, INACTIVITY_MS);
      }
      const _throttledActivity = throttle(resetInactivityTimer, 60000);
      ["mousemove", "keydown", "click", "touchstart", "scroll"].forEach(evt =>
        document.addEventListener(evt, _throttledActivity, { passive: true })
      );
      // Kick off immediately on page load
      if (ACCESS_TOKEN) resetInactivityTimer();

      // If JWT auth was used, save tenant_id from URL to localStorage for future visits
      if (!localStorage.getItem("tenant_id") && params.get("tenant_id")) {
        localStorage.setItem("tenant_id", params.get("tenant_id"));
        TENANT_ID = params.get("tenant_id");
      }

      function AccessDenied() {
        return (
          <div
            className="min-h-screen flex items-center justify-center"
            style={{ background: "#0a0f0e" }}
          >
            <div
              className="text-center p-8 rounded-2xl"
              style={{
                background: "#12181a",
                border: "1px solid #233033",
                maxWidth: 400,
              }}
            >
              <div className="text-4xl mb-4">🔒</div>
              <h1 className="text-xl font-bold text-white mb-2">
                Access Denied
              </h1>
              <p className="text-gray-400 text-sm mb-6">
                Please <a href="/login" className="text-emerald-400 underline">log in</a> to access your dashboard.
              </p>
              <a
                href="/login"
                className="inline-block px-6 py-2 rounded-lg text-sm font-semibold text-white"
                style={{ background: "#10b981" }}
              >
                Go to Login
              </a>
            </div>
          </div>
        );
      }

      if (!TENANT_ID) {
        ReactDOM.createRoot(document.getElementById("root")).render(
          <AccessDenied />,
        );
        throw new Error("No tenant_id");
      }

      // ── API Helper (JWT + Magic Link Support) ────────────────────────────────────
      async function api(path, opts = {}, _isRetry = false) {
        const sep = path.includes("?") ? "&" : "?";
        const currentToken = getAccessToken();
        const useMagicLink = TOKEN && !currentToken;

        // Build headers - prefer JWT Authorization header
        const headers = {
          "Content-Type": "application/json",
          "X-Tenant-ID": TENANT_ID,
          ...(opts.headers || {}),
        };
        if (currentToken) headers["Authorization"] = `Bearer ${currentToken}`;

        // For backwards compatibility, still support token in URL (magic links)
        const url = useMagicLink ? `${path}${sep}tenant_id=${TENANT_ID}&token=${TOKEN}` : path;

        const res = await fetch(url, { ...opts, headers });

        // On 401: attempt silent token refresh once, then retry
        if (res.status === 401 && !_isRetry) {
          const refreshed = await tryRefreshTokenOnce();
          if (refreshed) {
            return api(path, opts, true); // retry with new token
          }
          // Refresh failed — clear session and send to login.
          // Use replace() (not href=) so the back button can't restore the
          // broken auth state and leave the dashboard stuck on "Disconnected".
          try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
          try {
            if (typeof showToast === "function") {
              showToast("Session expired. Redirecting to log in again…", "warning");
            }
          } catch (e) {}
          window.location.replace("/login?reason=expired");
          throw new Error("Session expired");
        }

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      // ── Toast notification system ────────────────────────────────────────────────
      (function () {
        const container = document.createElement("div");
        container.className = "bijou-toast-container";
        document.body.appendChild(container);

        const TYPE_STYLES = {
          error: {
            border: "1px solid #ef444460",
            color: "#ef4444",
            icon: "\u274c",
          },
          success: {
            border: "1px solid #10b98160",
            color: "#10b981",
            icon: "\u2705",
          },
          info: {
            border: "1px solid #3b82f660",
            color: "#60a5fa",
            icon: "\u2139\ufe0f",
          },
          warning: {
            border: "1px solid #f59e0b60",
            color: "#f59e0b",
            icon: "\u26a0\ufe0f",
          },
        };

        window.showToast = function (message, type) {
          type = type || "error";
          const s = TYPE_STYLES[type] || TYPE_STYLES.error;
          const toast = document.createElement("div");
          toast.className = "bijou-toast";
          toast.style.border = s.border;
          // SECURITY: message can contain attacker-influenced text (e.g. a WhatsApp
          // contact name), so inject it via textContent — never interpolate into innerHTML.
          toast.innerHTML =
            `<span style="font-size:16px;flex-shrink:0;line-height:1">${s.icon}</span>` +
            `<span class="bijou-toast-msg" style="color:#e5e7eb;flex:1"></span>` +
            `<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#9aa7a4;cursor:pointer;font-size:16px;line-height:1;padding:0;flex-shrink:0">&times;</button>`;
          toast.querySelector(".bijou-toast-msg").textContent = message;
          container.appendChild(toast);
          setTimeout(
            function () {
              toast.classList.add("toast-out");
              setTimeout(function () {
                toast.remove();
              }, 300);
            },
            type === "error" ? 6000 : 4000,
          );
        };
      })();

      const LangCtx = React.createContext("en");

      const T = {

          knowledge:"Latihan AI",media:"Media",leads:"Kenalan",calls:"Tempahan Panggilan",settings:"Tetapan",help_center:"Bantuan & Sokongan",
          logout:"Log Keluar",all:"Semua",refresh:"Muat Semula",save:"Simpan",cancel:"Batal",edit:"Edit",

        },
      };

      // Premium inline-SVG icon set (Lucide/Feather family). Same keys + Icon API as the
      // old emoji map, so every <Icon name=… /> call site is unchanged. SVGs inherit
      // currentColor (nav active-state coloring now works), scale crisply, and take aria-label.
      const ICONS = {
        inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',

        "volume-2": '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
        "volume-x": '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
        // 2026-08-22: for the Integrations nav item — static/integrations.html
        // already exists and works, it just had no link from the dashboard.
        "link-2": '<path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"/><line x1="8" y1="12" x2="16" y2="12"/>',
        // 2026-08-22: for the Getting Started checklist's completed-step marker.

      };
      function Icon({ name, size = 18, className = "", title, style }) {
        return (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"

            role="img"
            aria-label={title || name}

      }

      // ── Stat Card ────────────────────────────────────────────────────────────────
      function StatCard({ label, value, icon, color = "#10b981", trend }) {
        return (
          <div
            className="rounded-xl p-5 fade-in"
            style={{ background: "#12181a", border: "1px solid #233033" }}

                className="text-xs font-medium uppercase tracking-wider"
                style={{ color: "#9aa7a4" }}

              </span>

                style={{ background: `${color}15` }}

                <Icon name={icon} size={16} className="" style={{ color }} />
              </div>
            </div>
            <div className="text-2xl font-bold text-white">{value ?? "—"}</div>
            {trend !== undefined && (
              <div
                className="text-xs mt-1"
                style={{ color: trend >= 0 ? "#34d399" : "#f87171" }}
              >
                {trend >= 0 ? "↑" : "↓"} {Math.abs(trend)}% vs yesterday

      // ── Badge ────────────────────────────────────────────────────────────────────
      function Badge({ children, color = "#10b981" }) {
        return (
          <span
            className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
            style={{ background: `${color}20`, color }}

            {children}
          </span>
        );
      }

      // ── Empty State ──────────────────────────────────────────────────────────────
      function Empty({ emoji = "📭", title, desc, actionLabel, onAction }) {
        return (
          <div className="flex flex-col items-center justify-center py-16 text-center">
            <div className="text-4xl mb-3">{emoji}</div>
            <div className="text-white font-semibold mb-1">{title}</div>
            <div className="text-sm" style={{ color: "#9aa7a4" }}>
              {desc}
            </div>
            {actionLabel && onAction && (
              <button
                onClick={onAction}
                className="mt-4 px-4 py-2 rounded-lg text-sm font-semibold transition-transform active:scale-95"
                style={{ background: "var(--accent)", color: "#04121a" }}

                {actionLabel}
