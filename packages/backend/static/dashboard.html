      // ════════════════════════════════════════════════════════════════════════════
      // ESCALATIONS MODULE
      // ════════════════════════════════════════════════════════════════════════════
      function EscalationsModule() {
        const [escalations, setEscalations] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filter, setFilter] = useState("all");
        const [actionMsg, setActionMsg] = useState("");

        const load = useCallback(() => {
          setLoading(true);
          const url =
            filter === "all"
              ? "/api/dashboard/escalations"
              : `/api/dashboard/escalations?status=${filter}`;
          api(url)
            .then((d) => {
              setEscalations(Array.isArray(d) ? d : []);
              setLoading(false);
            })
            .catch(() => {
              setEscalations([]);
              setLoading(false);
            });
        }, [filter]);

        useEffect(() => {
          load();
        }, [load]);

        async function resolve(id) {
          setActionMsg("Resolving...");
          try {
            await api(`/api/dashboard/escalations/${id}/resolve`, {
              method: "POST",
            });
            setActionMsg("✓ Resolved");
            load();
          } catch (e) {
            setActionMsg("❌ Failed to resolve");
          }
          setTimeout(() => setActionMsg(""), 3000);
        }

        const priorityColor = (p) =>
          p === "urgent" ? "#ef4444" : p === "high" ? "#f97316" : "#9aa7a4";
        const statusColor = (s) =>
          s === "pending"
            ? "#f59e0b"
            : s === "in_progress"
              ? "#3b82f6"
              : "#10b981";
        const statusLabel = (s) =>
          s === "in_progress"
            ? "In Progress"
            : s
              ? s.charAt(0).toUpperCase() + s.slice(1)
              : "Unknown";

        const FILTERS = ["all", "pending", "in_progress", "resolved"];
        const lang = useLang(); const t = k => T[lang][k] ?? T.en[k] ?? k;

        return (
          <div className="space-y-4 fade-in">
            {/* Header row — scrollable filter pills + icon refresh */}
            <div className="flex items-center gap-2">
              <div className="flex gap-1.5 overflow-x-auto pb-0.5 flex-1" style={{ scrollbarWidth:"none" }}>
                {FILTERS.map((f) => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    className="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium capitalize transition-colors"
                    style={{
                      background: filter === f ? "#10b98120" : "#12181a",
                      color: filter === f ? "#10b981" : "#9ca3af",
                      border: `1px solid ${filter === f ? "#10b98140" : "#233033"}`,
                    }}
                  >
                    {f === "all" ? t("all") : t(f)}
                  </button>
                ))}
              </div>
              <button
                onClick={load}
                className="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center transition-colors"
                style={{ background:"#233033", color:"#9ca3af", border:"1px solid #2a2a32", fontSize:16 }}
                title={t("refresh")}
              >
                ↻
              </button>
            </div>

            {actionMsg && (
              <div
                className="px-4 py-2 rounded-lg text-sm"
                style={{
                  background: "#10b98115",
                  color: "#10b981",
                  border: "1px solid #10b98130",
                }}
              >
                {actionMsg}
              </div>
            )}

            {loading ? (
              <div className="text-center py-12" style={{ color: "#9aa7a4" }}>
                Loading escalations...
              </div>
            ) : escalations.length === 0 ? (
              <div
                className="rounded-xl p-12 text-center"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <div className="text-3xl mb-3">🎉</div>
                <div className="text-white font-medium mb-1">
                  {t("no_escalations")}
                </div>
                <div className="text-sm" style={{ color: "#9aa7a4" }}>
                  {filter === "all"
                    ? t("no_escalations_desc")
                    : `${t("no_escalations")} (${t(filter)}).`}
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                {escalations.map((e) => (
                  <div
                    key={e.id}
                    className="rounded-xl p-4"
                    style={{
                      background: "#12181a",
                      border: "1px solid #233033",
                    }}
                  >
                    <div className="flex items-start justify-between gap-4">
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 flex-wrap mb-1.5">
                          {/* Priority badge */}
                          <span
                            className="text-xs px-2 py-0.5 rounded-full font-semibold capitalize"
                            style={{
                              background: priorityColor(e.priority) + "20",
                              color: priorityColor(e.priority),
                            }}
                          >
                            {e.priority || "normal"}
                          </span>
                          {/* Status badge */}
                          <span
                            className="text-xs px-2 py-0.5 rounded-full font-medium"
                            style={{
                              background: statusColor(e.status) + "20",
                              color: statusColor(e.status),
                            }}
                          >
                            {statusLabel(e.status)}
                          </span>
                          {/* Chat JID */}
                          <span
                            className="text-xs font-mono truncate"
                            style={{ color: "#9aa7a4" }}
                          >
                            {(e.chat_jid || "")
                              .replace("@s.whatsapp.net", "")
                              .replace("@lid", "")}
                          </span>
                        </div>
                        <p className="text-sm text-white mb-1">
                          {e.reason || "No reason provided"}
                        </p>
                        {typeof e.customer_context === 'string' && e.customer_context && (
                          <p
                            className="text-xs italic mt-1"
                            style={{ color: "#9aa7a4" }}
                          >
                            "{e.customer_context}"
                          </p>
                        )}
                        <div
                          className="text-xs mt-2"
                          style={{ color: "#4b5563" }}
                        >
                          {e.created_at
                            ? new Date(e.created_at).toLocaleString()
                            : ""}
                          {e.assigned_to
                            ? ` · Assigned to: ${e.assigned_to}`
                            : ""}
                        </div>
                      </div>
                      {/* Actions */}
                      <div className="flex flex-col gap-2 flex-shrink-0">
                        {e.status !== "resolved" && (
                          <button
                            onClick={() => resolve(e.id)}
                            className="px-3 py-1.5 rounded-lg text-xs font-medium"
                            style={{
                              background: "#10b98115",
                              color: "#10b981",
                              border: "1px solid #10b98130",
                            }}
                          >
                            ✓ Resolve
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // UPDATES MODULE  (unified activity feed)
      // ════════════════════════════════════════════════════════════════════════════
      function UpdatesModule() {
        const [events, setEvents] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          setLoading(true);
          Promise.all([
            api("/api/dashboard/conversations").catch(() => []),
            api("/api/dashboard/escalations").catch(() => []),
          ]).then(([convs, escs]) => {
            const convEvents = (Array.isArray(convs) ? convs : []).map((c) => ({
              type: "message",
              id: "conv-" + c.id,
              title: displayName(c),
              desc: c.last_message || "(no message)",
              time: c.updated_at,
              icon: "💬",
              color: c.status === "agent" ? "#f59e0b" : "#10b981",
              badge: c.status === "agent" ? "Agent Active" : "AI Handling",
            }));
            const escEvents = (Array.isArray(escs) ? escs : []).map((e) => ({
              type: "escalation",
              id: "esc-" + e.id,
              title: (e.chat_jid || "")
                .replace("@s.whatsapp.net", "")
                .replace("@lid", ""),
              desc: e.reason || "Escalated to agent",
              time: e.created_at,
              icon: "🚨",
              color:
                e.priority === "urgent"
                  ? "#ef4444"
                  : e.priority === "high"
                    ? "#f97316"
                    : "#f59e0b",
              badge:
                e.status === "resolved"
                  ? "Resolved"
                  : e.status === "in_progress"
                    ? "In Progress"
                    : "Pending",
            }));
            const all = [...convEvents, ...escEvents].sort(
              (a, b) => new Date(b.time) - new Date(a.time),
            );
            setEvents(all);
            setLoading(false);
          });
        }, []);

        function timeAgo(iso) {
          if (!iso) return "";
          const diff = (Date.now() - new Date(iso)) / 1000;
          if (diff < 60) return "just now";
          if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
          if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
          return `${Math.floor(diff / 86400)}d ago`;
        }

        return (
          <div className="space-y-4 fade-in">
            <div className="flex items-center justify-between">
              <p className="text-sm" style={{ color: "#9aa7a4" }}>
                Recent activity across conversations and escalations
              </p>
              <span
                className="text-xs px-2 py-1 rounded-full"
                style={{ background: "#233033", color: "#9ca3af" }}
              >
                {events.length} events
              </span>
            </div>

            {loading ? (
              <div className="text-center py-12" style={{ color: "#9aa7a4" }}>
                Loading activity...
              </div>
            ) : events.length === 0 ? (
              <div
                className="rounded-xl p-12 text-center"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <div className="text-3xl mb-3">📭</div>
                <div className="text-white font-medium mb-1">
                  No activity yet
                </div>
                <div className="text-sm" style={{ color: "#9aa7a4" }}>
                  Activity will appear here as customers message you.
                </div>
              </div>
            ) : (
              <div
                className="rounded-xl overflow-hidden"
                style={{ border: "1px solid #233033" }}
              >
                {events.map((ev, i) => (
                  <div
                    key={ev.id}
                    className="flex items-start gap-4 px-5 py-4"
                    style={{
                      background: i % 2 === 0 ? "#12181a" : "#131318",
                      borderTop: i > 0 ? "1px solid #233033" : "none",
                    }}
                  >
                    <div className="text-xl flex-shrink-0 mt-0.5">
                      {ev.icon}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5">
                        <span className="text-sm font-medium text-white truncate">
                          {ev.title}
                        </span>
                        <span
                          className="text-xs px-1.5 py-0.5 rounded-full flex-shrink-0"
                          style={{
                            background: ev.color + "20",
                            color: ev.color,
                          }}
                        >
                          {ev.badge}
                        </span>
                      </div>
                      <p
                        className="text-xs truncate"
                        style={{ color: "#9aa7a4" }}
                      >
                        {ev.desc}
                      </p>
                    </div>
                    <div
                      className="text-xs flex-shrink-0 mt-1"
                      style={{ color: "#4b5563" }}
                    >
                      {timeAgo(ev.time)}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // MAIN APP
      // ════════════════════════════════════════════════════════════════════════════

      // MODULE: TEST BIJOU — dry-run sandbox chat (no send, no persist) before go-live
      // ════════════════════════════════════════════════════════════════════════════
      function TestBijouModule() {
        const [msgs, setMsgs] = useState([]); // {role:'user'|'bijou', text, error?}
        const [input, setInput] = useState("");
        const [sending, setSending] = useState(false);
        const scrollRef = useRef(null);

        useEffect(() => {
          if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }, [msgs, sending]);

        const send = useCallback(async () => {
          const text = input.trim();
          if (!text || sending) return;
          setInput("");
          setMsgs((m) => [...m, { role: "user", text }]);
          setSending(true);
          // Signal Gem: soft confirm on send, thinking while API in flight.
          try { window.BjAudio && window.BjAudio.tick && window.BjAudio.tick(); } catch (_) {}
          try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("thinking"); } catch (_) {}
          try {
            const r = await api("/api/setup/test-message", {
              method: "POST", body: JSON.stringify({ message: text }),
            });
            const reply = (r && r.reply) || (r && r.error) || "No reply — make sure Bijou is set up (AI Training).";
            setMsgs((m) => [...m, { role: "bijou", text: reply, error: !!(r && r.ok === false) }]);
            // Signal Gem: speaking for length-proportional window, then idle.
            const dur = Math.min(2200, 600 + Math.floor(reply.length / 80) * 350);
            try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("speaking"); } catch (_) {}
            setTimeout(() => {
              try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
            }, dur);
          } catch (e) {
            setMsgs((m) => [...m, { role: "bijou", text: "Test failed: " + (e.message || "error"), error: true }]);
            // Signal Gem: brief thinking→idle on error (avoids stuck-in-speaking).
            setTimeout(() => {
              try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
            }, 800);
          } finally {
            setSending(false);
          }
        }, [input, sending]);

        return (
          <div className="space-y-4 fade-in">
            <div className="rounded-xl p-4" style={{ background: "linear-gradient(135deg,var(--surface-1),var(--surface-2))", border: "1px solid var(--border)" }}>
              <div className="flex items-center gap-2">
                <Icon name="bot" size={18} style={{ color: "var(--accent)" }} />
                <span className="font-semibold" style={{ color: "var(--text-hi)" }}>Test Bijou</span>
                <span className="ml-2 px-2 py-0.5 rounded-full text-xs font-semibold" style={{ background: "rgba(227,180,87,0.10)", color: "var(--premium-pale)", border: "1px solid rgba(227,180,87,0.25)" }}>Sandbox</span>
              </div>
              <p className="text-sm mt-1" style={{ color: "var(--text-mid)" }}>
                Chat with your AI exactly as a customer would. Nothing is sent to real customers and nothing is saved — try it before you go live.
              </p>
            </div>

            <div ref={scrollRef} className="rounded-xl p-4 overflow-y-auto" style={{ background: "var(--surface-1)", border: "1px solid var(--border)", height: 380 }}>
              {msgs.length === 0 && (
                <div className="h-full flex items-center justify-center text-center text-sm" style={{ color: "var(--text-mid)" }}>
                  Send a message to see how Bijou responds — e.g. &ldquo;What are your opening hours?&rdquo;
                </div>
              )}
              {msgs.map((m, i) => (
                <div key={i} className={"mb-2 flex " + (m.role === "user" ? "justify-end" : "justify-start")}>
                  <div className="px-3 py-2 rounded-2xl text-sm" style={{
                    maxWidth: "80%",
                    background: m.role === "user" ? "var(--accent)" : (m.error ? "#ef444418" : "var(--surface-2)"),
                    color: m.role === "user" ? "#04121a" : (m.error ? "#fca5a5" : "var(--text-hi)"),
                    border: m.role === "user" ? "none" : "1px solid var(--border)",
                    whiteSpace: "pre-wrap",
                  }}>{m.text}</div>
                </div>
              ))}
              {sending && <div className="text-xs" style={{ color: "var(--text-mid)" }}>Bijou is thinking&hellip;</div>}
            </div>

            <div className="flex gap-2">
              <input value={input} onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
                placeholder="Message Bijou as a test customer…"
                className="flex-1 px-3 py-2.5 rounded-lg text-sm"
                style={{ background: "var(--surface-1)", border: "1px solid var(--border)", color: "var(--text-hi)", outline: "none" }} />
              <button onClick={send} disabled={sending || !input.trim()}
                className="px-4 py-2.5 rounded-lg text-sm font-semibold transition-transform active:scale-95 flex items-center justify-center"
                style={{ background: "var(--accent)", color: "#04121a", opacity: (sending || !input.trim()) ? 0.5 : 1, minWidth: 48 }}>
                <Icon name="send" size={15} />
              </button>
            </div>
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════

        const [loading, setLoading] = useState(true);
        // 2026-08-22: Getting Started checklist dismiss state — declared here
        // (before the `if (loading) return` below) per React's rules of hooks.
        const [dismissedGettingStarted, setDismissedGettingStarted] = useState(
          () => localStorage.getItem("gettingStartedDismissed") === "true",
        );

        useEffect(() => {
          Promise.all([
            api("/api/dashboard/stats").catch(() => null),
            api("/api/dashboard/escalations").catch(() => []),
            api("/api/dashboard/whatsapp/status").catch(() => null),
          ]).then(([s, e, w]) => {
            setStats(s);

            <div
              className="rounded-2xl p-5 flex items-center gap-4"
              style={{
                background: "linear-gradient(135deg,var(--surface-1),var(--surface-2))",

            >
              <div
                className="flex items-center justify-center rounded-2xl flex-shrink-0"
                style={{ width: 56, height: 56, background: "#0a0f0e", border: "1px solid var(--premium)", color: "var(--accent)" }}
              >
                <Icon name="bot" size={30} />
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <span className="text-lg font-bold" style={{ color: "var(--text-hi)" }}>Bijou</span>
                  <span
                    className="px-2 py-0.5 rounded-full text-xs font-semibold"
                    style={{
                      background: onDuty ? "#10b98118" : "#9aa7a418",
                      color: onDuty ? "var(--accent-hi)" : "var(--text-mid)",
                      border: `1px solid ${onDuty ? "#10b98140" : "#9aa7a430"}`,
                    }}
                  >
                    <span className={onDuty ? "pulse-dot" : ""}>●</span> {onDuty ? "On duty" : "Standing by"}
                  </span>
                </div>
                <div className="text-sm mt-0.5" style={{ color: "var(--text-mid)" }}>
                  {greeting}! {onDuty
                    ? `Bijou handled ${ai} of ${conv} conversations (${aiPct}%) for you.`
                    : "Connect WhatsApp to put Bijou to work."}
                </div>
              </div>
              {!onDuty && (
                <button
                  onClick={() => go && go("settings")}
                  className="px-4 py-2 rounded-lg text-sm font-semibold flex-shrink-0 transition-transform active:scale-95"
                  style={{ background: "var(--accent)", color: "#04121a" }}
                >
                  Connect WhatsApp
                </button>
              )}
            </div>

            {/* 2026-08-22 UX AUDIT: a brand-new client landed here with four
                zeroed-out stat cards and no indication of what to do first —
                the product promises "set up in 5 minutes" but the first
                screen didn't guide anyone. This checklist gives the three
                setup steps in order, using state already fetched on this
                page (no new API calls). Dismissible once all steps are done,
                remembered via localStorage like the PWA-install banner does. */}
            {!(onDuty && conv > 0) && !dismissedGettingStarted && (
              <div
                className="rounded-2xl p-5"
                style={{ background: "var(--surface-1)", border: "1px solid var(--border)" }}
              >
                <div className="flex items-center justify-between mb-3">
                  <span className="text-sm font-semibold" style={{ color: "var(--text-hi)" }}>
                    Getting started
                  </span>
                  <button
                    onClick={() => {
                      localStorage.setItem("gettingStartedDismissed", "true");
                      setDismissedGettingStarted(true);
                    }}
                    className="text-xs"
                    style={{ color: "var(--text-mid)" }}
                  >
                    Dismiss
                  </button>
                </div>
                <div className="space-y-2">
                  {[
                    { done: onDuty, label: "Connect WhatsApp", to: "settings" },
                    { done: false, label: "Add your business info so your AI knows what to say", to: "ai_setup" },
                    { done: conv > 0, label: "Send a test message", to: "test" },
                  ].map((step, idx) => (
                    <button
                      key={idx}
                      onClick={() => go && go(step.to)}
                      className="w-full flex items-center gap-3 text-left px-3 py-2 rounded-lg transition-colors hover:bg-white hover:bg-opacity-5"
                    >
                      <span
                        className="flex-shrink-0 rounded-full flex items-center justify-center"
                        style={{
                          width: 20, height: 20,
                          background: step.done ? "var(--accent)" : "transparent",
                          border: step.done ? "none" : "1px solid var(--border)",
                        }}
                      >
                        {step.done && <Icon name="check" size={12} style={{ color: "#04121a" }} />}
                      </span>
                      <span
                        className="text-sm"
                        style={{ color: step.done ? "var(--text-mid)" : "var(--text-hi)", textDecoration: step.done ? "line-through" : "none" }}
                      >
                        {step.label}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Today's tally */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <StatCard label="Conversations" value={conv} icon="message-circle" />
              <StatCard label="AI-handled" value={aiPct + "%"} icon="bot" color="#E3B457" />
              <StatCard label="Messages today" value={stats?.messages_today ?? 0} icon="send" />
              <StatCard label="Leads today" value={stats?.leads_generated_today ?? 0} icon="users" />
            </div>

            {/* Needs you + at-a-glance */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
              <div className="rounded-xl p-4" style={{ background: "var(--surface-1)", border: "1px solid var(--border)" }}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2 font-semibold" style={{ color: "var(--text-hi)" }}>
                    <Icon name="alert-circle" size={16} style={{ color: pending ? "#ef4444" : "var(--text-mid)" }} /> Needs you
                  </div>
                  {pending > 0 && (
                    <span className="px-2 py-0.5 rounded-full text-xs font-bold" style={{ background: "#ef444420", color: "#ef4444" }}>
                      {pending}
                    </span>
                  )}
                </div>
                {pending > 0 ? (
                  <div className="space-y-2">
                    {esc.slice(0, 3).map((e, i) => (
                      <div key={i} className="text-sm truncate" style={{ color: "var(--text-mid)" }}>
                        • {e.customer_name || e.chat_jid || "A customer"} — {e.reason || e.last_message || "needs a human"}
                      </div>
                    ))}
                    <button onClick={() => go && go("escalations")} className="text-xs font-semibold mt-1" style={{ color: "var(--accent-hi)" }}>
                      Review all →
                    </button>
                  </div>
                ) : (
                  <div className="text-sm" style={{ color: "var(--text-mid)" }}>All clear — Bijou is handling everything. 🎉</div>
                )}
              </div>

              <div className="rounded-xl p-4" style={{ background: "var(--surface-1)", border: "1px solid var(--border)" }}>
                <div className="flex items-center gap-2 font-semibold mb-3" style={{ color: "var(--text-hi)" }}>
                  <Icon name="trending-up" size={16} style={{ color: "var(--accent-hi)" }} /> Today at a glance
                </div>
                <div className="space-y-2 text-sm" style={{ color: "var(--text-mid)" }}>
                  <div className="flex justify-between"><span>Bookings</span><span style={{ color: "var(--text-hi)" }}>{stats?.bookings_today ?? 0}</span></div>
                  <div className="flex justify-between"><span>Avg response</span><span style={{ color: "var(--text-hi)" }}>{stats?.avg_response_time || "—"}</span></div>
                  <div className="flex justify-between"><span>Active chats</span><span style={{ color: "var(--text-hi)" }}>{stats?.active_conversations ?? 0}</span></div>
                  <div className="flex justify-between"><span>Satisfaction</span><span style={{ color: "var(--accent-hi)" }}>{stats?.satisfaction_rate ? stats.satisfaction_rate + "%" : "—"}</span></div>
                </div>
                <button onClick={() => go && go("analytics")} className="text-xs font-semibold mt-3" style={{ color: "var(--accent-hi)" }}>
                  See performance →
                </button>
              </div>
            </div>

            {/* Quick actions */}
            <div className="flex flex-wrap gap-2">
              {[
                { label: "View conversations", to: "inbox", icon: "inbox" },
                { label: "Train Bijou", to: "knowledge", icon: "book-open" },
                { label: "Contacts", to: "leads", icon: "users" },
                { label: "Settings", to: "settings", icon: "settings" },
              ].map((q) => (
                <button
                  key={q.to}
                  onClick={() => go && go(q.to)}
                  className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition-transform active:scale-95"
                  style={{ background: "var(--surface-1)", border: "1px solid var(--border)", color: "var(--text-hi)" }}
                >
                  <Icon name={q.icon} size={15} /> {q.label}
                </button>
              ))}
            </div>
          </div>
        );
      }

      function App() {
        const [active, setActive] = useState("home");
        const [waConnected, setWaConnected] = useState(null);
        const [collapsed, setCollapsed] = useState(
          () => window.innerWidth < 1024,
        );
        const [mobileOpen, setMobileOpen] = useState(false);
        const [moreOpen, setMoreOpen] = useState(false);
        const [lang, setLang] = useState(() => localStorage.getItem("bijou_lang") || "en");
        const toggleLang = () => setLang(l => { const nl = l==="en"?"my":"en"; localStorage.setItem("bijou_lang",nl); return nl; });
        const [installPrompt, setInstallPrompt] = useState(null);
        const [showInstallBanner, setShowInstallBanner] = useState(false);

        // Signal Gem mute state — single source of truth is body[data-bj-audio]
        // (the controller writes it on toggle and reads it on init). React state
        // mirrors it so the sidebar button can re-render on every change.
        const [soundMuted, setSoundMuted] = useState(
          () => document.body.getAttribute("data-bj-audio") === "off",
        );
        const toggleSoundMute = () => {
          const next = !soundMuted;
          setSoundMuted(next);
          try { window.BjAudio && window.BjAudio.mute && window.BjAudio.mute(next); } catch (_) {}
        };
        // Keep React state in sync if the controller (or DevTools) flips the
        // body attribute from elsewhere. Cheap — only fires on actual mutations.
        useEffect(() => {
          const obs = new MutationObserver(() => {
            const m = document.body.getAttribute("data-bj-audio") === "off";
            setSoundMuted((prev) => (prev === m ? prev : m));
          });
          obs.observe(document.body, { attributes: true, attributeFilter: ["data-bj-audio"] });
          return () => obs.disconnect();
        }, []);

        // Escalation notifications
        const [escalNotifCount, setEscalNotifCount] = useState(0);
        const escalSeenRef = useRef(new Set());

        function playEscalSound() {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.setValueAtTime(440, ctx.currentTime + 0.15);
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.6);
          } catch (e) {}
        }

        useEffect(() => {
          const pollEscalations = async () => {
            try {
              const data = await api("/api/dashboard/escalations?status=pending");
              if (!Array.isArray(data)) return;
              const ids = data.map(e => e.id);
              const newOnes = ids.filter(id => !escalSeenRef.current.has(id));
              if (newOnes.length > 0 && escalSeenRef.current.size > 0) {
                playEscalSound();
                showToast(`🚨 ${newOnes.length} new escalation${newOnes.length > 1 ? "s" : ""}! Check Escalations.`, "error");
              }
              ids.forEach(id => escalSeenRef.current.add(id));
              setEscalNotifCount(data.length);
            } catch (e) {}
          };
          pollEscalations();
          const iv = setInterval(pollEscalations, 30000);
          return () => clearInterval(iv);
        }, []);

        // Dynamic NAV labels based on lang
        const tl = k => T[lang][k] ?? T.en[k] ?? k;
        // 2026-08-22 UX AUDIT (docs/superpowers/specs/2026-08-22-dashboard-ux-audit.md):
        // 13 flat nav items with no grouping made the sidebar intimidating for
        // the actual audience (a non-technical SME owner). Added `group` so the
        // render loop below can insert section headers — same items, same ids,
        // same routes, just organized by "how often you'd touch this." Also
        // renamed two labels that are internal-jargon ("Escalations", "AI Setup")
        // to plain language; these are hardcoded English display strings only
        // (like "Test Bijou"/"Outreach" already were) — the underlying
        // escalations table/API/tl() keys are untouched.
        const NAV = [
          { id: "home", label: "Home", icon: "home", group: "today" },
          { id: "inbox", label: tl("inbox"), icon: "inbox", group: "today" },
          { id: "escalations", label: "Needs You", icon: "alert-circle", group: "today" },
          { id: "leads", label: tl("leads"), icon: "users", group: "grow" },
          { id: "outreach", label: "Outreach", icon: "send", href: "/outreach", group: "grow" },
          { id: "calls", label: tl("calls"), icon: "phone", group: "grow" },
          { id: "analytics", label: tl("analytics"), icon: "bar-chart-2", group: "grow" },
          { id: "ai_setup", label: "Teach My AI", icon: "zap", href: "/kb-wizard", group: "setup" },
          { id: "knowledge", label: tl("knowledge"), icon: "book-open", group: "setup" },
          // 2026-08-22 FIX: /integrations (static/integrations.html, backed
          // by src/connectors/oauth_api.py) already existed and worked but
          // wasn't linked from anywhere in the dashboard — a new client had
          // no way to discover it short of typing the URL directly.
          { id: "integrations", label: "Connect Your Tools", icon: "link-2", href: "/integrations", group: "setup" },
          { id: "test", label: "Test Bijou", icon: "bot", group: "setup" },
          { id: "media", label: tl("media"), icon: "image", group: "account" },
          { id: "settings", label: tl("settings"), icon: "settings", group: "account" },
          { id: "help", label: tl("help_center"), icon: "life-buoy", href: "/help", group: "account" },
          { id: "updates", label: tl("updates"), icon: "activity", group: "account" },
        ];
        const NAV_GROUP_LABELS = { today: "Today", grow: "Grow", setup: "Set Up Your AI", account: "Account" };

        useEffect(() => {
          api("/api/dashboard/whatsapp/status")
            .then((d) => setWaConnected(d?.connected))
            .catch(() => setWaConnected(false));

          // PWA install prompt — pick up early-captured event first
          const applyPrompt = (e) => {
            setInstallPrompt(e);
            if (!sessionStorage.getItem("pwaInstallDismissed"))
              setShowInstallBanner(true);
          };
          if (window._pwaInstallPrompt) {
            applyPrompt(window._pwaInstallPrompt);
          }
          const onPromptReady = () => applyPrompt(window._pwaInstallPrompt);
          window.addEventListener("pwaPromptReady", onPromptReady);
          window.addEventListener("appinstalled", () => {
            setShowInstallBanner(false);
            setInstallPrompt(null);
            window._pwaInstallPrompt = null;
          });

          // Service worker
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/sw.js").catch(() => {});
          }

          // Sidebar auto-collapse on small screens
          const onResize = () => {
            if (window.innerWidth >= 1024) {
              setMobileOpen(false);
            }
            setCollapsed(window.innerWidth < 1024);
          };
          window.addEventListener("resize", onResize);
          return () => {
            window.removeEventListener("pwaPromptReady", onPromptReady);
            window.removeEventListener("resize", onResize);
          };
        }, []);

        const handleInstall = async () => {
          if (!installPrompt) return;
          installPrompt.prompt();
          const { outcome } = await installPrompt.userChoice;
          if (outcome === "accepted") {
            setShowInstallBanner(false);
            setInstallPrompt(null);
          }
        };

        const modules = {
          home: <HomeModule go={setActive} />,
          test: <TestBijouModule />,
          inbox: <InboxModule />,
          escalations: <EscalationsModule />,
          updates: <UpdatesModule />,
          analytics: <AnalyticsModule />,
          knowledge: <KnowledgeModule />,
          media: <MediaModule />,
          leads: <LeadsModule />,
          calls: <CallsModule />,
          settings: <SettingsModule />,
        };

        const isIconOnly = collapsed && !mobileOpen;

        return (
          <LangCtx.Provider value={lang}>
          <>
            <div
              className="flex h-screen overflow-hidden"
              style={{ background: "#0a0f0e" }}
            >
              {/* Mobile backdrop */}
              {mobileOpen && (
                <div
                  className="mobile-backdrop lg:hidden"
                  onClick={() => setMobileOpen(false)}
                />
              )}

              {/* ── Sidebar ──────────────────────────────────────────────────────── */}
              <div
                className={`flex-shrink-0 flex flex-col sidebar-w ${mobileOpen ? "mobile-sidebar" : "relative"}`}
                style={{
                  width: isIconOnly ? "56px" : "224px",
                  background: "#0c1211",
                  borderRight: "1px solid #233033",
                }}
              >
                {/* Logo row + collapse toggle */}
                <div
                  className="px-3 py-4 border-b flex items-center justify-between"
                  style={{ borderColor: "#233033", minHeight: "64px" }}
                >
                  {isIconOnly ? (
                    <div className="flex flex-col items-center gap-1.5 mx-auto">
                      <button
                        onClick={() => setCollapsed(false)}
                        title="Expand sidebar"
                      >
                        <span
                          className="bj-gem state-idle"
                          data-bj-state="idle"
                          style={{ display: "inline-block", width: 32, height: 32 }}
                        >
                          <span className="m" style={{ display: "block", width: 32, height: 32 }}>
                            <svg viewBox="0 0 100 100" width="32" height="32" aria-label="Bijou AI">
                              <path className="gem-body" fill="#E3B457" d="M30,12 L70,12 L88,40 L70,73 L50,73 L26,92 L33,73 L12,40 Z" />
                              <g className="bj-facets" fill="none" stroke="#0B3B2E" strokeWidth="1.6" strokeLinejoin="round" opacity="0.55">
                                <path className="facet-stroke" d="M40,26 L60,26 L68,40 L60,54 L40,54 L32,40 Z" />
                              </g>
                            </svg>
                          </span>
                        </span>
                      </button>
                      <button
                        onClick={toggleSoundMute}
                        className="p-1 rounded-md flex items-center justify-center transition-colors hover:bg-white hover:bg-opacity-5"
                        title={soundMuted ? "Unmute Signal Gem" : "Mute Signal Gem"}
                        style={{ color: soundMuted ? "#9aa7a4" : "#E3B457" }}
                      >
                        <Icon name={soundMuted ? "volume-x" : "volume-2"} size={12} />
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span
                          className="bj-gem state-idle flex-shrink-0"
                          data-bj-state="idle"
                          style={{ display: "inline-block", width: 32, height: 32 }}
                        >
                          <span className="m" style={{ display: "block", width: 32, height: 32 }}>
                            <svg viewBox="0 0 100 100" width="32" height="32" aria-label="Bijou AI">
                              <path className="gem-body" fill="#E3B457" d="M30,12 L70,12 L88,40 L70,73 L50,73 L26,92 L33,73 L12,40 Z" />
                              <g className="bj-facets" fill="none" stroke="#0B3B2E" strokeWidth="1.6" strokeLinejoin="round" opacity="0.55">
                                <path className="facet-stroke" d="M40,26 L60,26 L68,40 L60,54 L40,54 L32,40 Z" />
                              </g>
                            </svg>
                          </span>
                        </span>
                        <span className="font-bold text-white truncate">
                          Bijou AI
                        </span>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button
                          onClick={toggleSoundMute}
                          className="p-1.5 rounded-md flex items-center justify-center transition-colors hover:bg-white hover:bg-opacity-5"
                          title={soundMuted ? "Unmute Signal Gem" : "Mute Signal Gem"}
                          style={{ color: soundMuted ? "#9aa7a4" : "#E3B457" }}
                        >
                          <Icon name={soundMuted ? "volume-x" : "volume-2"} size={14} />
                        </button>
                        <button
                          onClick={() => {
                            setCollapsed(true);
                            setMobileOpen(false);
                          }}
                          className="p-1.5 rounded-md hidden lg:flex items-center justify-center transition-colors hover:bg-white hover:bg-opacity-5"
                          title="Collapse sidebar"
                          style={{ color: "#9aa7a4" }}
                        >
                          <Icon name="chevron-left" size={14} />
                        </button>
                      </div>
                    </>
                  )}
                </div>

                {/* WA status */}
                {!isIconOnly && (
                  <div
                    className="px-4 py-2.5 border-b flex items-center gap-1.5"
                    style={{ borderColor: "#233033" }}
                  >
                    <div
                      className="w-1.5 h-1.5 rounded-full flex-shrink-0"
                      style={{
                        background:
                          waConnected === true
                            ? "#10b981"
                            : waConnected === false
                              ? "#ef4444"
                              : "#9aa7a4",
                      }}
                    />
                    <span
                      className="text-xs truncate"
                      style={{ color: "#9aa7a4" }}
                    >
                      {waConnected === true
                        ? "WhatsApp connected"
                        : waConnected === false
                          ? "WhatsApp offline"
                          : "Checking…"}
                    </span>
                  </div>
                )}

                {/* Nav items */}
                <nav className="flex-1 px-2 py-4 space-y-0.5 overflow-y-auto">
                  {NAV.map((n, i) => (
                    <React.Fragment key={n.id}>
                      {/* Group header — only when this item starts a new group,
                          and only in expanded (non-icon-only) mode; there's no
                          room for a text header in the collapsed rail. */}
                      {!isIconOnly && n.group && n.group !== NAV[i - 1]?.group && (
                        <div
                          className="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider"
                          style={{ color: "#5b6b68" }}
                        >
                          {NAV_GROUP_LABELS[n.group] || n.group}
                        </div>
                      )}
                    <div className="nav-tooltip-wrap">
                      {n.href ? (
                        <a
                          href={n.href}
                          className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 ${isIconOnly ? "justify-center" : "gap-3"}`}
                          style={{
                            background: active === n.id ? "#10b98118" : "transparent",
                            color: active === n.id ? "#10b981" : "#9ca3af",
                            border: active === n.id ? "1px solid #10b98125" : "1px solid transparent",
                            textDecoration: "none",
                          }}
                          title={isIconOnly ? n.label : undefined}
                        >
                          <Icon name={n.icon} size={16} />
                          {!isIconOnly && <span>{n.label}</span>}
                        </a>
                      ) : (
                        <button
                          onClick={() => {
                            setActive(n.id);
                            setMobileOpen(false);
                          }}
                          className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-150 ${isIconOnly ? "justify-center" : "gap-3"}`}
                          style={{
                            background:
                              active === n.id ? "#10b98118" : "transparent",
                            color: active === n.id ? "#10b981" : "#9ca3af",
                            border:
                              active === n.id
                                ? "1px solid #10b98125"
                                : "1px solid transparent",
                          }}
                          title={isIconOnly ? n.label : undefined}
                        >
                          <Icon name={n.icon} size={16} />
                          {!isIconOnly && <span>{n.label}</span>}
                        </button>
                      )}
                      {isIconOnly && (
                        <span className="nav-tooltip">{n.label}</span>
                      )}
                    </div>
                    </React.Fragment>
                  ))}
                </nav>

                {/* Business identity — the workspace, not a raw UUID */}
                {!isIconOnly && (
                  <div
                    className="px-4 py-3 border-t flex items-center gap-3"
                    style={{ borderColor: "var(--border)" }}
                  >
                    <div
                      className="flex items-center justify-center rounded-xl flex-shrink-0"
                      style={{
                        width: 34, height: 34,
                        background: "linear-gradient(135deg,#12181a,#1a2224)",
                        border: "1px solid var(--premium)",
                        color: "var(--premium-pale)", fontWeight: 700, fontSize: 14,
                      }}
                    >
                      {BUSINESS_INITIAL}
                    </div>
                    <div className="min-w-0">
                      <div
                        className="text-sm font-semibold truncate"
                        style={{ color: "var(--text-hi)" }}
                        title={BUSINESS_NAME || "Your workspace"}
                      >
                        {BUSINESS_NAME || "Your workspace"}
                      </div>
                      <div className="text-xs truncate" style={{ color: "var(--text-mid)" }}>
                        Bijou workspace
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* ── Main content ─────────────────────────────────────────────────── */}
              <div className="flex-1 flex flex-col overflow-hidden min-w-0">
                {/* Install prompt banner */}
                {showInstallBanner && (
                  <div className="install-banner px-4 py-2 flex items-center justify-between gap-4 flex-shrink-0">
                    <div
                      className="flex items-center gap-2 text-sm"
                      style={{ color: "#10b981" }}
                    >
                      <Icon name="download" size={14} />
                      <span className="hidden sm:inline">
                        Install Bijou AI for a faster, app-like experience
                      </span>
                      <span className="sm:hidden">
                        Install for faster access
                      </span>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button
                        onClick={handleInstall}
                        className="px-3 py-1 text-xs font-semibold rounded-md"
                        style={{ background: "#10b981", color: "#000" }}
                      >
                        Install
                      </button>
                      <button
                        onClick={() => {
                          setShowInstallBanner(false);
                          sessionStorage.setItem("pwaInstallDismissed", "1");
                        }}
                        className="px-3 py-1 text-xs rounded-md"
                        style={{ color: "#9aa7a4" }}
                      >
                        Later
                      </button>
                    </div>
                  </div>
                )}

                {/* Topbar */}
                <div
                  className="px-4 sm:px-6 py-3.5 border-b flex items-center justify-between flex-shrink-0"
                  style={{ background: "#0c1211", borderColor: "#233033" }}
                >
                  <div className="flex items-center gap-3 min-w-0">
                    {/* Mobile hamburger */}
                    <button
                      className="p-1.5 rounded-md lg:hidden flex items-center justify-center transition-colors hover:bg-white hover:bg-opacity-5"
                      onClick={() => setMobileOpen((o) => !o)}
                      title="Open menu"
                      style={{ color: "#9ca3af" }}
                    >
                      <Icon name="menu" size={20} />
                    </button>
                    <div className="min-w-0">
                      <h1 className="text-base font-semibold truncate" style={{ color: "var(--text-hi)" }}>
                        {T[lang][active] ?? NAV.find((n) => n.id === active)?.label}
                      </h1>
                      <p className="text-xs truncate hidden sm:block" style={{ color: "var(--text-mid)" }}>
                        {({
                          home: "Here's what Bijou did for you today",
                          test: "Try Bijou as a customer would — a safe sandbox",
                          inbox: "Live conversations Bijou is handling",
                          escalations: "Chats that need a human — you",
                          updates: "Everything Bijou did recently",
                          analytics: "What Bijou delivered for you",
                          knowledge: "What Bijou knows about your business",
                          media: "Files shared across conversations",
                          leads: "Your customers, captured automatically",
                          calls: "Bookings and call scheduling",
                          settings: "Tune how your employee behaves",
                        })[active] || "Your AI employee, on duty"}
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    {/* Escalation notification bell */}
                    <button
                      onClick={() => setActive("escalations")}
                      className="relative p-1.5 rounded-md transition-colors hover:bg-white hover:bg-opacity-5"
                      style={{ color: escalNotifCount > 0 ? "#ef4444" : "#9aa7a4" }}
                      title={escalNotifCount > 0 ? `${escalNotifCount} pending escalation${escalNotifCount > 1 ? "s" : ""}` : "No pending escalations"}
                    >
                      <Icon name="bell" size={18} />
                      {escalNotifCount > 0 && (
                        <span
                          className="absolute -top-1 -right-1 w-4 h-4 rounded-full flex items-center justify-center text-white font-bold"
                          style={{ background: "#ef4444", fontSize: "9px" }}
                        >
                          {escalNotifCount > 9 ? "9+" : escalNotifCount}
                        </span>
                      )}
                    </button>
                    {/* Language toggle EN/MY */}
                    <button
                      onClick={toggleLang}
                      className="px-2 py-1.5 text-xs font-bold rounded-md transition-all"
                      style={{
                        background: lang==="my" ? "#f59e0b18" : "#10b98112",
                        color: lang==="my" ? "#f59e0b" : "#10b981",
                        border: `1px solid ${lang==="my" ? "#f59e0b30" : "#10b98130"}`,
                        minWidth: 38,
                        letterSpacing: "0.05em",
                      }}
                      title="Switch language / Tukar bahasa"
                    >
                      {lang==="en" ? "MY" : "EN"}
                    </button>
                    <button
                      onClick={async () => {
                        if (confirm("Are you sure you want to log out?")) {
                          try {
                            // Call logout API if JWT auth is being used
                            if (ACCESS_TOKEN) {
                              await fetch("/api/auth/logout", {
                                method: "POST",
                                headers: {
                                  "Authorization": `Bearer ${ACCESS_TOKEN}`,
                                  "Content-Type": "application/json"
                                }
                              });
                            }
                          } catch (err) {
                            console.error("Logout API failed:", err);
                          }

                          // Clear all session data
                          localStorage.clear();
                          sessionStorage.clear();

                          // Redirect to login (use replace so back button can't restore stale state)
                          window.location.replace("/login");
                        }
                      }}
                      className="px-3 py-1.5 text-xs font-medium rounded-md transition-colors"
                      style={{
                        background: "#ef444415",
                        color: "#ef4444",
                        border: "1px solid #ef444420",
                      }}
                      title="Log out"
                    >
                      {T[lang].logout}
                    </button>
                    <div
                      className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
                      style={{
                        background: "linear-gradient(135deg,#12181a,#1a2224)",
                        color: "var(--premium-pale)",
                        border: "1px solid var(--premium)",
                      }}
                      title={BUSINESS_NAME || "Your workspace"}
                    >
                      {BUSINESS_INITIAL}
                    </div>
                  </div>
                </div>

                {/* Page content */}
                <div className="main-scroll-area flex-1 overflow-y-auto p-4 sm:p-6">
                  <div key={active} className="page-enter">
                    {modules[active]}
                  </div>
                </div>
              </div>
            </div>


          </>
          </LangCtx.Provider>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <!-- Signal Gem: audio controller.
         The controller self-initialises on DOMContentLoaded and exposes itself
         as `window.BjAudio` (NOT `BijouAudio` — that was the old name; calling
         BijouAudio.init() against the undefined global was a no-op).
         MP3s live in /static/ (this app's static dir), so override the
         controller's default `audio-identity/` base BEFORE the script loads. -->
    <script>window.BJ_AUDIO_BASE = '/static/';</script>
    <script src="/static/signal-gem-audio.js"></script>
    <script>
      // Per-event wiring (defensive — wrapped in try/catch so a missing/unloaded
      // BjAudio is a silent no-op, not a console error during the first second
      // of page load before the controller script runs):
      //   - TestBijouModule.send (sandbox chat): tick + setState("thinking")
      //     on user send, setState("speaking") for length-proportional window
      //     on reply, brief thinking→idle on error.
      //   - InboxModule.sendReply (live human-handoff): tick + setState("thinking")
      //     while API in flight, 900ms setState("speaking") on success, brief
      //     thinking→idle on error.
      //   - InboxModule.handleReplyChange (agent typing in reply box): 180ms-
      //     debounced setState("listening") on keystroke, setState("idle")
      //     when the box clears.
      //   - InboxModule fetchMessages poll: play("notify") on inbound customer
      //     messages (role === "user"), setState("speaking") for length-
      //     proportional window on bot auto-replies.
      //   - InboxModule selected change effect: cancel any pending
      //     replyListenTimer and force setState("idle") so a typing-state from
      //     the previous chat doesn't leak into the new one.
      //   - Mute toggle: see soundMuted/toggleSoundMute in App.
    </script>
  </body>
</html>
