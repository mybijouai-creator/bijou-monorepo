      // ── Spinner ──────────────────────────────────────────────────────────────────
      function Spinner() {
        return (
          <div className="flex items-center justify-center py-12">
            <div
              className="w-8 h-8 border-2 rounded-full animate-spin"
              style={{ borderColor: "#233033", borderTopColor: "#10b981" }}
            />
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: INBOX
      // ════════════════════════════════════════════════════════════════════════════

      // Slash-command definitions — shown in autocomplete popup
      const SLASH_COMMANDS = [
        {
          cmd: "/takeover",
          desc: "Take over this conversation from AI",
          icon: "🙋",
        },
        {
          cmd: "/ai",
          desc: "Return conversation to AI auto-reply",
          icon: "🤖",
        },
        {
          cmd: "/manglish",
          desc: "Toggle Manglish mode on/off for this tenant",
          icon: "🇲🇾",
        },
        {
          cmd: "/block",
          desc: "Block this contact from AI replies",
          icon: "🚫",
        },
        { cmd: "/clear", desc: "Clear the reply box", icon: "🗑️" },
      ];

      function InboxModule() {
        const [conversations, setConversations] = useState([]);
        const [selected, setSelected] = useState(null);
        const [loading, setLoading] = useState(true);
        const [takeover, setTakeover] = useState({});
        const [reply, setReply] = useState("");
        const [sending, setSending] = useState(false);
        const [loadingMessages, setLoadingMessages] = useState(false);
        const [newMsgAlert, setNewMsgAlert] = useState(false); // "new message" banner when scrolled up
        const [slashMenu, setSlashMenu] = useState(null); // null | [{cmd,desc,icon}]
        const [slashIdx, setSlashIdx] = useState(0); // keyboard selection index
        const [inboxSearch, setInboxSearch] = useState(""); // conversation search

        // Refs
        const selectedRef = useRef(null);
        const messagesEndRef = useRef(null); // bottom anchor for auto-scroll
        const scrollBoxRef = useRef(null); // the scrollable message container
        const atBottomRef = useRef(true); // track if user is scrolled to bottom
        const prevMsgCount = useRef(0); // detect new messages
        // Signal Gem: 180ms debounce on typing → setState("listening"). Shared
        // with handleReplyChange (sets it) and sendReply/selected-change (clear it).
        // Declared between sendReply and handleReplyChange in source order, but JS
        // const TDZ doesn't bite because both functions are only called at runtime.
        const replyListenTimer = useRef(null);

        // ── Helpers ───────────────────────────────────────────────────────────────
        function scrollToBottom(force = false) {
          if (force || atBottomRef.current) {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            setNewMsgAlert(false);
          }
        }

        function handleScroll() {
          const box = scrollBoxRef.current;
          if (!box) return;
          const distFromBottom =
            box.scrollHeight - box.scrollTop - box.clientHeight;
          atBottomRef.current = distFromBottom < 80;
          if (atBottomRef.current) setNewMsgAlert(false);
        }

        // ── Message rich-text formatter ───────────────────────────────────────────
        function formatMsgContent(raw) {
          if (!raw) return "";
          // 1. Normalise [BREAK] / [break] → real newlines
          let t = raw.replace(/\[BREAK\]/gi, "\n");
          // 2. Escape HTML to prevent XSS
          t = t
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          // 3. WhatsApp-style *bold* (must be whole word boundaries, not inside words)
          t = t.replace(/\*((?:[^*\n])+)\*/g, "<strong>$1</strong>");
          // 4. WhatsApp-style _italic_
          t = t.replace(/_((?:[^_\n])+)_/g, "<em>$1</em>");
          // 5. ~strikethrough~
          t = t.replace(/~((?:[^~\n])+)~/g, "<s>$1</s>");
          // 6. Convert newlines → <br> (paragraph breaks get double space)
          t = t.replace(/\n\n/g, "<br><br>").replace(/\n/g, "<br>");
          return t;
        }

        // ── Data loading ──────────────────────────────────────────────────────────
        const fetchMessages = useCallback(async (jid) => {
          if (!jid) return;
          try {
            const msgs = await api(
              `/api/dashboard/messages/${encodeURIComponent(jid)}`,
            );
            if (selectedRef.current !== jid) return; // user switched away
            setConversations((prev) => {
              // Capture the previous message list BEFORE we overwrite it, so we
              // can detect new arrivals and fire Signal Gem audio cues. The
              // pre-existing prevMsgCount.current ref already filters out
              // initial loads, so we don't get a notify chime every time the
              // agent opens a conversation.
              const existing = prev.find((c) => c.chat_jid === jid);
              const prevMsgs = (existing && existing.messages) || [];
              const nextMsgs = Array.isArray(msgs) ? msgs : [];
              if (nextMsgs.length > prevMsgs.length) {
                const newOnes = nextMsgs.slice(prevMsgs.length);
                // Only fire cues for the most recent new message — multiple
                // backfill inserts in one poll would otherwise stack chimes.
                const latest = newOnes[newOnes.length - 1];
                if (latest) {
                  const role = latest.role;
                  if (role === "user") {
                    // Inbound customer message → soft notify chime.
                    try { window.BjAudio && window.BjAudio.play && window.BjAudio.play("notify"); } catch (_) {}
                  } else if (role === "assistant" || role === "bot") {
                    // Bot auto-reply in a still-AI-handled conversation → speaking
                    // pulse for a length-proportional window. The agent's own sent
                    // message is already acked by sendReply's tick, so this fires
                    // only on Bijou's spontaneous replies.
                    const text = (latest.text || latest.body || latest.message || latest.content || "") + "";
                    const dur = Math.min(2400, 600 + Math.floor(text.length / 80) * 350);
                    try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("speaking"); } catch (_) {}
                    setTimeout(() => {
                      // Only return to idle if the gem is still in "speaking".
                      // Otherwise the user has already transitioned to listening
                      // (typing) or thinking (a new send) and we shouldn't clobber.
                      try {
                        const bj = document.querySelector(".bj-gem");
                        if (bj && bj.getAttribute("data-bj-state") === "speaking") {
                          window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle");
                        }
                      } catch (_) {}
                    }, dur);
                  }
                }
              }
              return prev.map((conv) =>
                conv.chat_jid === jid
                  ? { ...conv, messages: nextMsgs }
                  : conv,
              );
            });
          } catch (e) {
            console.error("fetchMessages error:", e);
          }
        }, []);

        const load = useCallback(async () => {
          try {
            const data = await api("/api/dashboard/conversations");
            setConversations((prev) => {
              const fresh = Array.isArray(data)
                ? data
                : data.conversations || [];
              const merged = fresh.map((c) => {
                const existing = prev.find((p) => p.chat_jid === c.chat_jid);
                return existing && existing.messages
                  ? { ...c, messages: existing.messages }
                  : c;
              });
              // Auto-select first conversation on very first load (prev was empty)
              if (
                prev.length === 0 &&
                merged.length > 0 &&
                !selectedRef.current
              ) {
                const first = merged[0];
                selectedRef.current = first.chat_jid;
                // Defer state updates to avoid setState-during-render
                setTimeout(() => {
                  setSelected(first.chat_jid);
                  fetchMessages(first.chat_jid);
                }, 0);
              }
              return merged;
            });
          } catch (e) {
            console.warn("Poll error (non-fatal):", e);
          } finally {
            setLoading(false);
          }
          // Also refresh messages for currently open conversation
          const activeJid = selectedRef.current;
          if (activeJid) {
            await fetchMessages(activeJid);
          }
        }, [fetchMessages]);

        // Poll conversations + messages every 5s (was 10s/5s separate)
        useEffect(() => {
          load();
          const t = setInterval(load, 5000);
          return () => clearInterval(t);
        }, [load]);

        // Auto-scroll when messages array changes
        useEffect(() => {
          const sel = conversations.find(
            (c) => c.chat_jid === selectedRef.current,
          );
          const msgs = sel?.messages || [];
          if (msgs.length > prevMsgCount.current) {
            // New messages arrived
            if (atBottomRef.current) {
              scrollToBottom(true);
            } else {
              setNewMsgAlert(true);
            }
          }
          prevMsgCount.current = msgs.length;
        }, [conversations]);

        // Reset scroll tracking when conversation changes
        useEffect(() => {
          prevMsgCount.current = 0;
          atBottomRef.current = true;
          setNewMsgAlert(false);
          // Scroll to bottom immediately when switching conversations
          setTimeout(() => scrollToBottom(true), 50);
          // Signal Gem: cancel any pending listening debounce and force the gem
          // back to "idle" so a typing-state from the previous chat doesn't
          // leak into the new one (would visibly pulse "listening" while the
          // agent is just reading the new chat).
          if (replyListenTimer.current) {
            clearTimeout(replyListenTimer.current);
            replyListenTimer.current = null;
          }
          try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
        }, [selected]);

        // ── Actions ────────────────────────────────────────────────────────────────
        async function handleTakeover(chatJid) {
          try {
            await api(`/api/dashboard/takeover`, {
              method: "POST",
              body: JSON.stringify({
                customer_jid: chatJid,
                action: "takeover",
              }),
            });
            setTakeover((p) => ({ ...p, [chatJid]: true }));
          } catch (e) {
            showToast("Takeover failed: " + e.message);
          }
        }

        async function handleReturnToAI(chatJid) {
          try {
            await api(
              `/api/dashboard/return-to-ai/${encodeURIComponent(chatJid)}?agent_name=Agent`,
              {
                method: "POST",
              },
            );
            setTakeover((p) => ({ ...p, [chatJid]: false }));
          } catch (e) {
            showToast("Return to AI failed: " + e.message);
          }
        }

        async function sendReply(chatJid) {
          if (!reply.trim()) return;
          setSending(true);
          // Signal Gem: cancel any pending listening debounce (prevents the
          // keystroke debounce from slamming us back to "listening" mid-reply),
          // soft-confirm send, and flip to "thinking" while the API is in flight.
          if (replyListenTimer.current) {
            clearTimeout(replyListenTimer.current);
            replyListenTimer.current = null;
          }
          try { window.BjAudio && window.BjAudio.tick && window.BjAudio.tick(); } catch (_) {}
          try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("thinking"); } catch (_) {}
          try {
            await api("/api/dashboard/send-message", {
              method: "POST",
              body: JSON.stringify({ customer_jid: chatJid, message: reply }),
            });
            setReply("");
            setSlashMenu(null);
            // Immediately refresh messages so sent reply appears
            await fetchMessages(chatJid);
            scrollToBottom(true);
            // Signal Gem: short 900ms "speaking" pulse on success — the agent
            // already knows they sent, so the pulse is just a brief confirmation.
            try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("speaking"); } catch (_) {}
            setTimeout(() => {
              try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
            }, 900);
          } catch (e) {
            showToast("Send failed: " + e.message);
            // Signal Gem: brief 700ms "thinking" then "idle" on error (visually
            // distinct from success and shorter so the UI feels responsive).
            setTimeout(() => {
              try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
            }, 700);
          }
          setSending(false);
        }

        // ── Slash command handling ─────────────────────────────────────────────────
        function handleReplyChange(e) {
          const val = e.target.value;
          setReply(val);
          if (val.startsWith("/")) {
            const filter = val.toLowerCase();
            const matches = SLASH_COMMANDS.filter((c) =>
              c.cmd.startsWith(filter),
            );
            setSlashMenu(matches.length ? matches : null);
            setSlashIdx(0);
          } else {
            setSlashMenu(null);
          }
          // Signal Gem: 180ms debounce → setState("listening") while the agent
          // is typing. Clearing the box returns to "idle" immediately. Without
          // the debounce, setState would fire on every keystroke and thrash the
          // gem's CSS animation. sendReply cancels the pending timer so a
          // mid-typing Send click doesn't slam us back to "listening" after the
          // reply is already in flight.
          if (replyListenTimer.current) clearTimeout(replyListenTimer.current);
          if (val.length > 0) {
            replyListenTimer.current = setTimeout(() => {
              try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("listening"); } catch (_) {}
            }, 180);
          } else {
            try { window.BjAudio && window.BjAudio.setState && window.BjAudio.setState("idle"); } catch (_) {}
          }
        }

        async function executeSlashCommand(cmd, chatJid) {
          setReply("");
          setSlashMenu(null);
          if (!chatJid) return;
          if (cmd === "/takeover") {
            await handleTakeover(chatJid);
          } else if (cmd === "/ai") {
            await handleReturnToAI(chatJid);
          } else if (cmd === "/manglish") {
            try {
              // Toggle manglish via settings API
              const current = await api(
                `/api/settings/current?tenant_id=${TENANT_ID}`,
              ).catch(() => null);
              const current_val = current?.manglish_mode ?? false;
              await api("/api/settings/auto-reply", {
                method: "PUT",
                body: JSON.stringify({
                  auto_reply_enabled: current?.auto_reply_enabled ?? true,
                  manglish_mode: !current_val,
                  welcome_message: current?.welcome_message || null,
                }),
              });
              showToast(
                `🇲🇾 Manglish mode ${!current_val ? "ON — Bijou will mix English + Malay" : "OFF — Bijou back to English"}`,
                !current_val ? "success" : "info",
              );
            } catch (e) {
              showToast("Manglish toggle failed: " + e.message);
            }
          } else if (cmd === "/block") {
            const sel = conversations.find((c) => c.chat_jid === chatJid);
            const phone =
              (sel?.customer_name || chatJid).replace(/[^0-9]/g, "") ||
              chatJid.replace("@lid", "").replace("@s.whatsapp.net", "");
            const reason = prompt(
              `Block reason for ${displayName(sel || { chat_jid: chatJid })}?`,
              "Blocked via dashboard",
            );
            if (reason === null) return; // cancelled
            try {
              await api("/api/dashboard/blacklist", {
                method: "POST",
                body: JSON.stringify({
                  phone_number: phone || chatJid,
                  reason,
                }),
              });
              showToast(
                `🚫 ${displayName(sel || { chat_jid: chatJid })} blocked`,
                "warning",
              );
            } catch (e) {
              showToast("Block failed: " + e.message);
            }
          } else if (cmd === "/clear") {
            setReply("");
          }
        }

        function handleReplyKeyDown(e, chatJid) {
          if (slashMenu && slashMenu.length > 0) {
            if (e.key === "ArrowDown") {
              e.preventDefault();
              setSlashIdx((i) => Math.min(i + 1, slashMenu.length - 1));
              return;
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              setSlashIdx((i) => Math.max(i - 1, 0));
              return;
            }
            if (e.key === "Tab" || e.key === "Enter") {
              e.preventDefault();
              executeSlashCommand(slashMenu[slashIdx].cmd, chatJid);
              return;
            }
            if (e.key === "Escape") {
              setSlashMenu(null);
              return;
            }
          }
          if (e.key === "Enter" && !e.shiftKey && !slashMenu) {
            e.preventDefault();
            sendReply(chatJid);
          }
        }

        // ── Mobile view state (list vs chat) ──────────────────────────────────────
        const [mobileView, setMobileView] = useState("list");

        // ── Render ─────────────────────────────────────────────────────────────────
        const sel = selected
          ? conversations.find((c) => c.chat_jid === selected)
          : null;

        // Responsive: on mobile show one panel at a time; tablet+ show both
        // list: always visible on sm+; full-width on mobile when mobileView==='list'
        // chat: always visible on sm+; full-width on mobile when mobileView==='chat'
        const listHidden = mobileView === "chat"; // mobile only
        const chatHidden = mobileView === "list" && !selected; // also hide empty chat on mobile

        // Filter conversations by name / phone
        const q = inboxSearch.trim().toLowerCase();
        const filteredConvs = q
          ? conversations.filter((c) => {
              const name = (
                c.contact_name ||
                c.customer_name ||
                c.chat_jid ||
                ""
              ).toLowerCase();
              const phone = (c.chat_jid || "").replace(/[^0-9]/g, "");
              const lastMsg = (c.last_message || "").toLowerCase();
              return (
                name.includes(q) || phone.includes(q) || lastMsg.includes(q)
              );
            })
          : conversations;

        return (
          <div className="flex h-full gap-0 sm:gap-4">
            {/* Conversation list */}
            <div
              className={`flex-shrink-0 flex flex-col rounded-xl overflow-hidden transition-all duration-200 ${
                listHidden ? "hidden sm:flex" : "flex"
              } w-full sm:w-64 lg:w-72`}
              style={{ background: "#12181a", border: "1px solid #233033" }}
            >
              <div className="p-4 border-b" style={{ borderColor: "#233033" }}>
                <h3 className="font-semibold text-white text-sm">
                  Conversations
                </h3>
                <p className="text-xs mt-0.5" style={{ color: "#9aa7a4" }}>
                  {filteredConvs.length}
                  {q ? ` of ${conversations.length}` : " active"}
                </p>
                {/* search input */}
                <input
                  type="search"
                  placeholder="Search name or message…"
                  value={inboxSearch}
                  onChange={(e) => setInboxSearch(e.target.value)}
                  className="mt-2 w-full text-xs rounded-lg px-3 py-1.5 outline-none"
                  style={{
                    background: "#0d0d12",
                    border: "1px solid #233033",
                    color: "#e5e7eb",
                  }}
                />
              </div>
              <div className="flex-1 overflow-y-auto">
                {loading && <Spinner />}
                {!loading && filteredConvs.length === 0 && (
                  <Empty
                    emoji={q ? "🔍" : "💬"}
                    title={q ? "No matches" : "No conversations"}
                    desc={
                      q
                        ? `Nothing found for "${inboxSearch}"`
                        : "Messages will appear here"
                    }
                  />
                )}
                {filteredConvs.map((c) => (
                  <button
                    key={c.chat_jid}
                    onClick={async () => {
                      const clickedJid = c.chat_jid;
                      selectedRef.current = clickedJid;
                      setSelected(clickedJid);
                      setMobileView("chat"); // switch to chat view on mobile
                      setLoadingMessages(true);
                      try {
                        const msgs = await api(
                          `/api/dashboard/messages/${encodeURIComponent(clickedJid)}`,
                        );
                        if (selectedRef.current === clickedJid) {
                          setConversations((prev) =>
                            prev.map((conv) =>
                              conv.chat_jid === clickedJid
                                ? {
                                    ...conv,
                                    messages: Array.isArray(msgs) ? msgs : [],
                                  }
                                : conv,
                            ),
                          );
                        }
                      } catch (e) {
                        console.warn(
                          "Failed to load messages for",
                          clickedJid,
                          e,
                        );
                        if (selectedRef.current === clickedJid) {
                          setConversations((prev) =>
                            prev.map((conv) =>
                              conv.chat_jid === clickedJid && !conv.messages
                                ? { ...conv, messages: [], _loadError: true }
                                : conv,
                            ),
                          );
                        }
                      } finally {
                        if (selectedRef.current === clickedJid) {
                          setLoadingMessages(false);
                        }
                      }
                    }}
                    className="w-full text-left p-4 border-b transition-colors"
                    style={{
                      borderColor: "#233033",
                      background:
                        selected === c.chat_jid ? "#233033" : "transparent",
                    }}
                  >
                    <div className="flex items-center gap-3">
                      <div
                        className="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0"
                        style={{ background: "#10b98120", color: "#10b981" }}
                      >
                        {displayName(c)[0].toUpperCase()}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-1">
                          <div className="text-sm font-medium text-white truncate">
                            {displayName(c)}
                          </div>
                          {c.updated_at && (
                            <div
                              className="text-xs flex-shrink-0"
                              style={{ color: "#4b5563" }}
                            >
                              {new Date(c.updated_at).toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit",
                              })}
                            </div>
                          )}
                        </div>
                        <div
                          className="text-xs truncate mt-0.5"
                          style={{
                            color:
                              selected === c.chat_jid ? "#9ca3af" : "#9aa7a4",
                          }}
                        >
                          {(() => { const lm = c.last_message || ""; const t = lm.trimStart(); if (t.startsWith("[IMPORTANT:") || t.startsWith("[INSTRUCTION:")) return "🎤 Voice message"; return lm || "No messages"; })()}
                        </div>
                      </div>
                      {c.unread > 0 && (
                        <span
                          className="text-xs px-1.5 py-0.5 rounded-full font-bold flex-shrink-0"
                          style={{ background: "#10b981", color: "#000" }}
                        >
                          {c.unread}
                        </span>
                      )}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* Chat panel */}
            <div
              className={`flex flex-col rounded-xl overflow-hidden chat-panel-mobile ${
                mobileView === "list" ? "hidden sm:flex" : "flex"
              } flex-1 min-w-0`}
              style={{ background: "#12181a", border: "1px solid #233033" }}
            >
              {!sel ? (
                <div className="flex-1 flex flex-col items-center justify-center gap-3">
                  {/* Back button for mobile when no chat selected but somehow visible */}
                  <button
                    onClick={() => setMobileView("list")}
                    className="sm:hidden absolute top-4 left-4 flex items-center gap-1 text-sm px-3 py-1.5 rounded-lg"
                    style={{ background: "#233033", color: "#9ca3af" }}
                  >
                    <Icon name="chevron-left" size={16} /> Back
                  </button>
                  <Empty
                    emoji="💬"
                    title="Select a conversation"
                    desc="Choose a conversation from the list to start"
                  />
                </div>
              ) : (
                <>
                  {/* Chat header */}
                  <div
                    className="p-3 sm:p-4 border-b flex items-center gap-3"
                    style={{ borderColor: "#233033" }}
                  >
                    {/* Back arrow — mobile only */}
                    <button
                      onClick={() => setMobileView("list")}
                      className="sm:hidden flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full"
                      style={{ background: "#233033", color: "#9ca3af" }}
                      title="Back to conversations"
                    >
                      <Icon name="chevron-left" size={18} />
                    </button>
                    {/* Avatar */}
                    <div
                      className="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0"
                      style={{ background: "#10b98120", color: "#10b981" }}
                    >
                      {displayName(sel)[0].toUpperCase()}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-white truncate">
                        {displayName(sel)}
                      </div>
                      <div
                        className="text-xs flex items-center gap-1.5 mt-0.5"
                        style={{ color: "#9aa7a4" }}
                      >
                        {sel.contact_tag && (
                          <span
                            className="px-1.5 py-0.5 rounded font-medium capitalize flex-shrink-0"
                            style={{
                              background:
                                (TAG_COLORS[sel.contact_tag] || "#9aa7a4") +
                                "20",
                              color: TAG_COLORS[sel.contact_tag] || "#9aa7a4",
                            }}
                          >
                            {sel.contact_tag.replace("_", " ")}
                          </span>
                        )}
                        <span className="truncate">
                          {sel.updated_at ? (
                            <>
                              Last msg{" "}
                              {new Date(sel.updated_at).toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit",
                              })}
                            </>
                          ) : (
                            sel.chat_jid
                          )}
                        </span>
                      </div>
                    </div>
                    <div className="flex gap-2 items-center flex-shrink-0">
                      <span
                        className="text-xs px-2 py-0.5 rounded-full"
                        style={{
                          background: takeover[sel.chat_jid]
                            ? "#f59e0b20"
                            : "#10b98120",
                          color: takeover[sel.chat_jid] ? "#f59e0b" : "#10b981",
                        }}
                      >
                        {takeover[sel.chat_jid] ? "🙋 Agent" : "🤖 AI"}
                      </span>
                      {takeover[sel.chat_jid] ? (
                        <button
                          onClick={() => handleReturnToAI(sel.chat_jid)}
                          className="px-3 py-1.5 rounded-lg text-xs font-medium"
                          style={{
                            background: "#233033",
                            color: "#10b981",
                            border: "1px solid #10b98140",
                          }}
                        >
                          Return to AI
                        </button>
                      ) : (
                        <button
                          onClick={() => handleTakeover(sel.chat_jid)}
                          className="px-3 py-1.5 rounded-lg text-xs font-medium"
                          style={{ background: "#10b981", color: "#000" }}
                        >
                          Take Over
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Messages area */}
                  <div
                    ref={scrollBoxRef}
                    onScroll={handleScroll}
                    className="flex-1 overflow-y-auto p-4 space-y-2"
                    style={{ scrollBehavior: "smooth" }}
                  >
                    {loadingMessages && <Spinner />}
                    {!loadingMessages &&
                      (sel.messages || []).filter((m) => {
                        const t = (m.content || "").trimStart();
                        return !t.startsWith("[IMPORTANT:") && !t.startsWith("[INSTRUCTION:");
                      }).map((m, i) => (
                        <div
                          key={m.id || i}
                          className={`flex ${m.role === "user" ? "justify-start" : "justify-end"} fade-in`}
                        >
                          <div
                            className="max-w-sm px-3 py-2 rounded-2xl text-sm shadow-sm"
                            style={{
                              background:
                                m.role === "user" ? "#2a2a32" : "#10b981",
                              color: m.role === "user" ? "#e5e7eb" : "#000",
                              borderBottomLeftRadius:
                                m.role === "user" ? "4px" : "18px",
                              borderBottomRightRadius:
                                m.role === "user" ? "18px" : "4px",
                            }}
                          >
                            <div
                              style={{
                                whiteSpace: "pre-wrap",
                                wordBreak: "break-word",
                                lineHeight: "1.55",
                              }}
                              dangerouslySetInnerHTML={{ __html: formatMsgContent(m.content) }}
                            />
                            <div className="text-xs mt-1 opacity-60 text-right">
                              {m.timestamp
                                ? new Date(m.timestamp).toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit",
                                  })
                                : ""}
                              {m.role === "assistant" && (
                                <span className="ml-1">✓✓</span>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    {!loadingMessages && sel._loadError && (
                      <div className="flex flex-col items-center justify-center py-8 text-center">
                        <div className="text-2xl mb-2">⚠️</div>
                        <div className="text-white text-sm font-medium mb-1">
                          Failed to load messages
                        </div>
                        <button
                          onClick={async () => {
                            setLoadingMessages(true);
                            try {
                              const msgs = await api(
                                `/api/dashboard/messages/${encodeURIComponent(sel.chat_jid)}`,
                              );
                              setConversations((prev) =>
                                prev.map((conv) =>
                                  conv.chat_jid === sel.chat_jid
                                    ? {
                                        ...conv,
                                        messages: Array.isArray(msgs)
                                          ? msgs
                                          : [],
                                        _loadError: false,
                                      }
                                    : conv,
                                ),
                              );
                            } catch (e) {
                              console.warn("Retry failed:", e);
                            } finally {
                              setLoadingMessages(false);
                            }
                          }}
                          className="px-4 py-1.5 rounded-lg text-xs font-medium"
                          style={{ background: "#10b981", color: "#000" }}
                        >
                          Tap to retry
                        </button>
                      </div>
                    )}
                    {!loadingMessages &&
                      !sel._loadError &&
                      (!sel.messages || sel.messages.length === 0) && (
                        <Empty
                          emoji="🗨️"
                          title="No messages loaded"
                          desc="Messages will appear here once synced"
                        />
                      )}
                    {/* Bottom anchor for scroll */}
                    <div ref={messagesEndRef} />
                  </div>

                  {/* New message alert banner */}
                  {newMsgAlert && (
                    <div
                      onClick={() => scrollToBottom(true)}
                      className="mx-4 mb-2 px-4 py-2 rounded-lg text-xs font-medium cursor-pointer text-center"
                      style={{ background: "#10b981", color: "#000" }}
                    >
                      ↓ New message — tap to scroll down
                    </div>
                  )}

                  {/* Reply area with slash command popup */}
                  <div
                    className="chat-input-wrap p-3 border-t relative"
                    style={{ borderColor: "#233033" }}
                  >
                    {/* Slash command autocomplete */}
                    {slashMenu && slashMenu.length > 0 && (
                      <div
                        className="absolute bottom-full left-3 right-3 mb-1 rounded-xl overflow-hidden shadow-lg"
                        style={{
                          background: "#233033",
                          border: "1px solid #2a2a32",
                          zIndex: 50,
                        }}
                      >
                        <div
                          className="px-3 py-1.5 text-xs"
                          style={{
                            color: "#9aa7a4",
                            borderBottom: "1px solid #2a2a32",
                          }}
                        >
                          Commands — ↑↓ navigate · Tab/Enter to run · Esc to
                          close
                        </div>
                        {slashMenu.map((sc, i) => (
                          <button
                            key={sc.cmd}
                            onMouseDown={(e) => {
                              e.preventDefault();
                              executeSlashCommand(sc.cmd, sel.chat_jid);
                            }}
                            className="w-full flex items-center gap-3 px-3 py-2.5 text-left transition-colors"
                            style={{
                              background:
                                i === slashIdx ? "#10b98115" : "transparent",
                            }}
                          >
                            <span className="text-base">{sc.icon}</span>
                            <div>
                              <div
                                className="text-sm font-medium"
                                style={{
                                  color: i === slashIdx ? "#10b981" : "#e5e7eb",
                                }}
                              >
                                {sc.cmd}
                              </div>
                              <div
                                className="text-xs"
                                style={{ color: "#9aa7a4" }}
                              >
                                {sc.desc}
                              </div>
                            </div>
                          </button>
                        ))}
                      </div>
                    )}

                    <div className="flex gap-2">
                      <div className="flex-1 relative">
                        <input
                          value={reply}
                          onChange={handleReplyChange}
                          onKeyDown={(e) => handleReplyKeyDown(e, sel.chat_jid)}
                          placeholder={
                            takeover[sel.chat_jid]
                              ? "Reply as agent… or type / for commands"
                              : "AI is handling — type / for commands or just reply"
                          }
                          className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                          style={{
                            background: "#233033",
                            border: "1px solid #2a2a32",
                          }}
                        />
                      </div>
                      <button
                        onClick={() => sendReply(sel.chat_jid)}
                        disabled={sending || !reply.trim()}
                        className="px-4 py-2 rounded-lg text-sm font-medium disabled:opacity-40 flex items-center gap-1"
                        style={{ background: "#10b981", color: "#000" }}
                      >
                        {sending ? "…" : "➤"}
                      </button>
                    </div>
                    <div
                      className="text-xs mt-1.5"
                      style={{ color: "#3a3a44" }}
                    >
                      Type <span style={{ color: "#9aa7a4" }}>/</span> for
                      commands · Enter to send · Shift+Enter for new line
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: ANALYTICS
      // ════════════════════════════════════════════════════════════════════════════
      function AnalyticsModule() {
        const [stats, setStats] = useState(null);
        const [waStatus, setWaStatus] = useState(null);
        const [esc, setEsc] = useState([]);
        const [loading, setLoading] = useState(true);
        const [period, setPeriod] = useState(30);
        const [chartData, setChartData] = useState(null);
        const [chartLoading, setChartLoading] = useState(false);
        const chartRef = React.useRef(null);
        const chartInstance = React.useRef(null);

        useEffect(() => {
          Promise.all([
            api("/api/dashboard/stats").catch(() => null),
            api("/api/dashboard/whatsapp/status").catch(() => null),
            api("/api/dashboard/escalations").catch(() => []),
          ]).then(([s, w, e]) => {
            setStats(s);
            setWaStatus(w);
            setEsc(Array.isArray(e) ? e : e?.escalations || []);
            setLoading(false);
          });
        }, []);

        useEffect(() => {
          setChartLoading(true);
          api(`/api/dashboard/analytics/timeseries?days=${period}`)
            .then((d) => {
              setChartData(d);
              setChartLoading(false);
            })
            .catch(() => {
              setChartLoading(false);
            });
        }, [period]);

        useEffect(() => {
          if (!chartRef.current || !chartData) return;
          if (chartInstance.current) {
            chartInstance.current.destroy();
            chartInstance.current = null;
          }
          const ctx = chartRef.current.getContext("2d");
          chartInstance.current = new window.Chart(ctx, {
            type: "line",
            data: {
              labels: chartData.labels.map((l) => {
                const d = new Date(l + "T00:00:00");
                return d.toLocaleDateString("en-MY", {
                  month: "short",
                  day: "numeric",
                });
              }),
              datasets: [
                {
                  label: "Messages",
                  data: chartData.messages,
                  borderColor: "#6366f1",
                  backgroundColor: "rgba(99,102,241,0.10)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 3,
                },
                {
                  label: "Leads",
                  data: chartData.leads,
                  borderColor: "#10b981",
                  backgroundColor: "rgba(16,185,129,0.10)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 3,
                },
                {
                  label: "Escalations",
                  data: chartData.escalations,
                  borderColor: "#ef4444",
                  backgroundColor: "rgba(239,68,68,0.08)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 3,
                },
                {
                  label: "Bookings",
                  data: chartData.bookings || [],
                  borderColor: "#f59e0b",
                  backgroundColor: "rgba(245,158,11,0.10)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 3,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: {
                legend: { labels: { color: "#e5e7eb", boxWidth: 12 } },
                tooltip: {
                  backgroundColor: "#12181a",
                  borderColor: "#233033",
                  borderWidth: 1,
                },
              },
              scales: {
                x: {
                  ticks: { color: "#9aa7a4", maxTicksLimit: 8 },
                  grid: { color: "#233033" },
                },
                y: {
                  ticks: { color: "#9aa7a4", precision: 0 },
                  grid: { color: "#233033" },
                  beginAtZero: true,
                },
              },
            },
          });
          return () => {
            if (chartInstance.current) {
              chartInstance.current.destroy();
              chartInstance.current = null;
            }
          };
        }, [chartData]);

        if (loading) return <Spinner />;

        return (
          <div className="space-y-6 fade-in">
            {/* WhatsApp Status Banner */}
            {waStatus && (
              <div
                className="flex items-center gap-3 px-4 py-3 rounded-xl"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <div
                  className={`w-2.5 h-2.5 rounded-full pulse-dot`}
                  style={{
                    background: waStatus.connected ? "#10b981" : "#ef4444",
                  }}
                />
                <span className="text-sm font-medium text-white">
                  WhatsApp {waStatus.connected ? "Connected" : "Disconnected"}
                </span>
                {waStatus.phone_number && (
                  <span className="text-sm" style={{ color: "#9aa7a4" }}>
                    {waStatus.phone_number}
                  </span>
                )}
                <span className="ml-auto text-xs" style={{ color: "#9aa7a4" }}>
                  Live status
                </span>
              </div>
            )}

            {/* Stats Grid — primary 4 */}
            {(() => { const lang = useLang(); const t = k => T[lang][k] ?? T.en[k] ?? k; return (
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <StatCard label={t("total_conversations")} value={stats?.total_conversations ?? 0} icon="message-circle" color="#10b981" />
              <StatCard label={t("ai_handled")} value={stats?.ai_handled ?? 0} icon="bot" color="#6366f1" />
              <StatCard label={t("human_handled")} value={stats?.human_handled ?? 0} icon="user" color="#f59e0b" />
              <StatCard label={t("messages_today")} value={stats?.messages_today ?? 0} icon="zap" color="#3b82f6" />
            </div>
            ); })()}
            {/* Stats Grid — secondary 5, scrollable row on mobile */}
            {(() => { const lang = useLang(); const t = k => T[lang][k] ?? T.en[k] ?? k; return (
            <div className="grid grid-cols-3 sm:grid-cols-5 gap-3">
              {[
                { key:"leads_today", value: stats?.leads_generated_today??0, icon:"trending-up", color:"#10b981" },
                { key:"avg_response", value: stats?.avg_response_time??"—", icon:"clock", color:"#8b5cf6" },
                { key:"bookings_today", value: stats?.bookings_today??0, icon:"calendar", color:"#f59e0b" },
                { key:"satisfaction", value: stats?.satisfaction_rate ? `${stats.satisfaction_rate}%` : "—", icon:"heart", color:"#ec4899" },
                { key:"active_now", value: stats?.active_conversations??0, icon:"activity", color:"#f97316" },
              ].map(s => (
                <div key={s.key} className="rounded-xl px-3 py-3 fade-in flex flex-col gap-1" style={{ background:"#12181a", border:"1px solid #233033" }}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-medium uppercase tracking-wide leading-tight" style={{ color:"#4b5563", fontSize:"9px" }}>{t(s.key)}</span>
                    <span style={{ fontSize:12 }}><Icon name={s.icon} size={12} /></span>
                  </div>
                  <div className="text-lg font-bold text-white leading-tight">{s.value}</div>
                </div>
              ))}
            </div>
            ); })()}

            {/* Activity Chart */}
            <div
              className="rounded-xl overflow-hidden"
              style={{ background: "#12181a", border: "1px solid #233033" }}
            >
              <div
                className="px-5 py-4 border-b flex items-center justify-between"
                style={{ borderColor: "#233033" }}
              >
                <h3 className="font-semibold text-white">Activity Overview</h3>
                <div className="flex gap-2">
                  {[7, 14, 30].map((d) => (
                    <button
                      key={d}
                      onClick={() => setPeriod(d)}
                      className="text-xs px-3 py-1 rounded-lg transition-colors"
                      style={{
                        background: period === d ? "#6366f1" : "#0d0d12",
                        color: period === d ? "#fff" : "#9aa7a4",
                        border: "1px solid",
                        borderColor: period === d ? "#6366f1" : "#233033",
                      }}
                    >
                      {d}d
                    </button>
                  ))}
                </div>
              </div>
              <div
                className="p-5"
                style={{ height: "260px", position: "relative" }}
              >
                {chartLoading ? (
                  <div className="flex items-center justify-center h-full">
                    <Spinner />
                  </div>
                ) : !chartData ? (
                  <div
                    className="flex items-center justify-center h-full text-sm"
                    style={{ color: "#9aa7a4" }}
                  >
                    No data available
                  </div>
                ) : (
                  <canvas
                    ref={chartRef}
                    style={{ width: "100%", height: "100%" }}
                  />
                )}
              </div>
            </div>

            {/* Escalations */}
            <div
              className="rounded-xl overflow-hidden"
              style={{ background: "#12181a", border: "1px solid #233033" }}
            >
              <div
                className="px-5 py-4 border-b"
                style={{ borderColor: "#233033" }}
              >
                <h3 className="font-semibold text-white">
                  Pending Escalations
                </h3>
              </div>
              {esc.length === 0 ? (
                <Empty
                  emoji="✅"
                  title="No escalations"
                  desc="All conversations are being handled by AI"
                />
              ) : (
                <div className="divide-y" style={{ borderColor: "#233033" }}>
                  {esc.map((e) => (
                    <div
                      key={e.id}
                      className="px-5 py-3 flex items-center gap-4"
                    >
                      <div
                        className="w-2 h-2 rounded-full"
                        style={{
                          background:
                            e.priority === "urgent"
                              ? "#ef4444"
                              : e.priority === "high"
                                ? "#f59e0b"
                                : "#10b981",
                        }}
                      />
                      <div className="flex-1">
                        <div className="text-sm font-medium text-white">
                          {displayName(e)}
                        </div>
                        <div className="text-xs" style={{ color: "#9aa7a4" }}>
                          {e.reason || "Escalation requested"}
                        </div>
                      </div>
                      <Badge
                        color={
                          e.priority === "urgent"
                            ? "#ef4444"
                            : e.priority === "high"
                              ? "#f59e0b"
                              : "#10b981"
                        }
                      >
                        {e.priority || "normal"}
                      </Badge>
                      <span className="text-xs" style={{ color: "#9aa7a4" }}>
                        {e.status}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: AI TRAINING (Knowledge Base)
      // ════════════════════════════════════════════════════════════════════════════
      function KnowledgeModule() {
        const [docs, setDocs] = useState([]);
        const [loading, setLoading] = useState(true);
        const [uploading, setUploading] = useState(false);
        const [text, setText] = useState("");
        const [title, setTitle] = useState("");
        const [note, setNote] = useState("");
        const [tab, setTab] = useState("list");
        const [fileUploadStatus, setFileUploadStatus] = useState("");
        const [showExample, setShowExample] = useState(false);
        const [importUrl, setImportUrl] = useState("");
        const [importText, setImportText] = useState("");
        const [importNote, setImportNote] = useState("");
        const [importLoading, setImportLoading] = useState(false);
        const [importResult, setImportResult] = useState(null);
        const [importNeedsPaste, setImportNeedsPaste] = useState(false);

        const EXAMPLE_TEXT = `Business: Maple Residences\n\nUnits Available:\n- Unit A: 3-bedroom, 1,200 sqft, RM 650,000\n- Unit B: 2-bedroom, 900 sqft, RM 480,000\n\nFacilities: Pool, Gym, 24H Security\n\nPayment:\n- 10% booking fee\n- Balance within 30 days\n- Bank loan up to 90%\n\nContact: Call 03-1234 5678 or WhatsApp to book a viewing.`;

        const load = useCallback(async () => {
          setLoading(true);
          try {
            const data = await api("/api/dashboard/knowledge/list");
            setDocs(data.documents || []);
          } catch {
            setDocs([]);
          }
          setLoading(false);
        }, []);

        useEffect(() => {
          load();
        }, [load]);

        async function uploadDoc() {
          if (!text.trim()) return;
          setUploading(true);
          try {
            await api("/api/dashboard/knowledge", {
              method: "POST",
              body: JSON.stringify({
                title: title || "Untitled",
                content: text,
                source: title || "dashboard_entry",
                note: note.trim(),
              }),
            });
            setText("");
            setTitle("");
            setNote("");
            setTab("list");
            load();
          } catch (e) {
            showToast("Upload failed: " + e.message);
          }
          setUploading(false);
        }

        async function uploadFile(e) {
          const file = e.target.files[0];
          if (!file) return;
          setUploading(true);
          setFileUploadStatus("Uploading...");
          try {
            const form = new FormData();
            form.append("file", file);
            form.append("title", file.name.replace(/\.[^.]+$/, ""));
            form.append("note", note.trim());
            // Use raw fetch for multipart (not our api() helper which sets JSON content-type)
            const params = new URLSearchParams({
              tenant_id: TENANT_ID,
              token: TOKEN,
            });
            const res = await fetch(
              `/api/dashboard/knowledge/upload-file?${params}`,
              {
                method: "POST",
                headers: authHeaders(),
                body: form,
              },
            );
            if (!res.ok) {
              const err = await res
                .json()
                .catch(() => ({ detail: res.statusText }));
              throw new Error(err.detail || "Upload failed");
            }
            setFileUploadStatus(
              "✅ File uploaded successfully! Bijou will now use this knowledge.",
            );
            setNote("");
            setTimeout(() => setFileUploadStatus(""), 4000);
            setTab("list");
            load();
          } catch (e) {
            setFileUploadStatus("❌ " + e.message);
          }
          setUploading(false);
          e.target.value = "";
        }

        async function deleteDoc(id) {
          if (!confirm("Delete this document?")) return;
          try {
            await api(`/api/dashboard/knowledge/${id}`, { method: "DELETE" });
            showToast("Document deleted.", "success");
            load();
          } catch (e) {
            // 404 = already gone on server, treat as success
            if (e.message && e.message.includes("404")) {
              showToast(
                "Document was already removed. Refreshing list.",
                "warning",
              );
              load();
            } else {
              showToast("Delete failed: " + e.message);
            }
          }
        }

        async function importListing() {
          if (!importUrl.trim()) return;
          setImportLoading(true);
          setImportResult(null);
          setImportNeedsPaste(false);
          try {
            const data = await api("/api/kb/import-listing", {
              method: "POST",
              body: JSON.stringify({ url: importUrl.trim(), note: importNote.trim() }),
            });
            if (data.needs_paste) {
              setImportNeedsPaste(true);
              setImportResult({ success: false, message: data.message });
            } else {
              setImportResult({ success: true, message: data.message });
              setImportUrl("");
              setImportNote("");
              setTimeout(() => { setImportResult(null); setTab("list"); load(); }, 2500);
            }
          } catch (e) {
            setImportResult({ success: false, message: "Import failed: " + e.message });
          }
          setImportLoading(false);
        }

        async function importListingText() {
          if (!importText.trim()) return;
          setImportLoading(true);
          setImportResult(null);
          try {
            const data = await api("/api/kb/import-text", {
              method: "POST",
              body: JSON.stringify({ text: importText.trim(), note: importNote.trim() }),
            });
            setImportResult({ success: true, message: data.message });
            setImportText("");
            setImportNote("");
            setTimeout(() => { setImportResult(null); setTab("list"); load(); }, 2500);
          } catch (e) {
            setImportResult({ success: false, message: "Import failed: " + e.message });
          }
          setImportLoading(false);
        }

        return (
          <div className="space-y-4 fade-in">
            {/* Two-purpose clarity banner */}
            <div
              className="rounded-xl p-4 flex gap-3"
              style={{ background: "#10b98112", border: "1px solid #10b98133" }}
            >
              <div className="text-2xl flex-shrink-0">🧠</div>
              <div>
                <div
                  className="text-sm font-semibold"
                  style={{ color: "#10b981" }}
                >
                  Train AI = Knowledge Library (here)
                </div>
                <div className="text-xs mt-0.5" style={{ color: "#9aa7a4" }}>
                  Upload PDFs, docs, or text that Bijou reads to{" "}
                  <strong>answer customer questions</strong>. Bijou extracts and
                  learns from the <em>text content</em>.
                </div>
                <div
                  className="text-xs mt-1.5 font-semibold"
                  style={{ color: "#f59e0b" }}
                >
                  📎 Share Files = Media Library
                </div>
                <div className="text-xs" style={{ color: "#9aa7a4" }}>
                  Images, brochures, videos you want Bijou to{" "}
                  <strong>attach and send</strong> to customers go in
                  <span style={{ color: "#10b981" }}> Media</span> (bottom nav).
                  Images are <em>not</em> read as text here.
                </div>
              </div>
            </div>
            <div className="flex gap-2 flex-wrap">
              {["list", "add", "file", "import"].map((t) => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className="px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                  style={{
                    background: tab === t ? "#10b981" : "#12181a",
                    color: tab === t ? "#000" : "#9ca3af",
                    border: "1px solid " + (tab === t ? "#10b981" : "#233033"),
                  }}
                >
                  {t === "list"
                    ? "Documents"
                    : t === "add"
                      ? "+ Add Text"
                      : t === "file"
                        ? "⬆ Upload File"
                        : "🏠 Import Listing"}
                </button>
              ))}
            </div>

            {tab === "list" && (
              <div
                className="rounded-xl overflow-hidden"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <div
                  className="px-5 py-4 border-b flex items-center justify-between"
                  style={{ borderColor: "#233033" }}
                >
                  <h3 className="font-semibold text-white">
                    Knowledge Documents
                  </h3>
                  <span
                    className="text-xs px-2 py-1 rounded-full"
                    style={{ background: "#233033", color: "#9aa7a4" }}
                  >
                    {docs.length} docs
                  </span>
                </div>
                {loading ? (
                  <Spinner />
                ) : docs.length === 0 ? (
                  <Empty
                    emoji="📚"
                    title="No documents yet"
                    desc="Add business FAQs, product info, or policies"
                  />
                ) : (
                  <div className="divide-y" style={{ borderColor: "#233033" }}>
                    {docs.map((d) => (
                      <div
                        key={d.id}
                        className="px-5 py-4 flex items-start gap-4"
                      >
                        <div
                          className="w-8 h-8 rounded-lg flex items-center justify-center text-sm flex-shrink-0"
                          style={{ background: "#10b98115", color: "#10b981" }}
                        >
                          📄
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="font-medium text-white text-sm truncate">
                            {d.title || d.name || d.filename || "Untitled"}
                          </div>
                          <div
                            className="text-xs mt-0.5 line-clamp-1"
                            style={{ color: "#9aa7a4" }}
                          >
                            {d.metadata?.note ? (
                              <span style={{ color: "#f59e0b" }}>
                                🎯 When to use: {d.metadata.note} —{" "}
                              </span>
                            ) : null}
                            {(d.content || d.content_extracted)
                              ?.replace(/^\[WHEN TO USE:[^\]]+\]\n\n/, "")
                              .substring(0, 100) || "—"}
                          </div>
                          <div
                            className="text-xs mt-1"
                            style={{ color: "#4b5563" }}
                          >
                            {d.created_at
                              ? new Date(d.created_at).toLocaleDateString()
                              : ""}
                          </div>
                        </div>
                        <button
                          onClick={() => deleteDoc(d.id)}
                          className="text-xs px-2 py-1 rounded"
                          style={{ color: "#ef4444", background: "#ef444410" }}
                        >
                          Delete
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab === "add" && (
              <div
                className="rounded-xl p-5 space-y-4"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <h3 className="font-semibold text-white">
                  Add Knowledge Document
                </h3>
                {/* Example template */}
                <div
                  className="rounded-lg p-3"
                  style={{ background: "#1a1a20", border: "1px solid #2a2a32" }}
                >
                  <button
                    onClick={() => setShowExample(!showExample)}
                    className="text-xs font-medium flex items-center gap-1.5"
                    style={{ color: "#10b981" }}
                  >
                    {showExample ? "▼" : "▶"} Show example template
                  </button>
                  {showExample && (
                    <div className="mt-2">
                      <pre
                        className="text-xs whitespace-pre-wrap"
                        style={{ color: "#9ca3af", fontFamily: "monospace" }}
                      >
                        {EXAMPLE_TEXT}
                      </pre>
                      <button
                        onClick={() => {
                          setText(EXAMPLE_TEXT);
                          setTitle("Business FAQ");
                          setShowExample(false);
                        }}
                        className="mt-2 text-xs px-3 py-1.5 rounded-lg font-medium"
                        style={{
                          background: "#10b98120",
                          color: "#10b981",
                          border: "1px solid #10b98140",
                        }}
                      >
                        Use this template
                      </button>
                    </div>
                  )}
                </div>
                <div>
                  <label
                    className="text-xs font-medium mb-1 block"
                    style={{ color: "#9ca3af" }}
                  >
                    Title
                  </label>
                  <input
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="e.g. FAQ, Pricing, Refund Policy"
                    className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                    style={{
                      background: "#233033",
                      border: "1px solid #2a2a32",
                    }}
                  />
                </div>
                <div>
                  <label
                    className="text-xs font-medium mb-1 block"
                    style={{ color: "#9ca3af" }}
                  >
                    Content
                  </label>
                  <textarea
                    value={text}
                    onChange={(e) => setText(e.target.value)}
                    placeholder="Paste your business FAQs, product descriptions, pricing, or any info you want Bijou to know..."
                    rows={10}
                    className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none resize-none"
                    style={{
                      background: "#233033",
                      border: "1px solid #2a2a32",
                    }}
                  />
                </div>
                <div>
                  <label
                    className="text-xs font-medium mb-1 block"
                    style={{ color: "#f59e0b" }}
                  >
                    🎯 When should Bijou use this? (Optional but recommended)
                  </label>
                  <input
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    placeholder="e.g. customer asks about pricing, unit types, payment plan, booking"
                    className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                    style={{
                      background: "#233033",
                      border: "1px solid #2a2a32",
                    }}
                  />
                  <p className="text-xs mt-1" style={{ color: "#4b5563" }}>
                    This helps Bijou know when to pull this document into the
                    conversation.
                  </p>
                </div>
                <button
                  onClick={uploadDoc}
                  disabled={uploading || !text.trim()}
                  className="px-6 py-2.5 rounded-lg text-sm font-semibold disabled:opacity-50"
                  style={{ background: "#10b981", color: "#000" }}
                >
                  {uploading ? "Uploading..." : "Upload Document"}
                </button>
              </div>
            )}

            {tab === "file" && (
              <div
                className="rounded-xl p-5 space-y-4"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <h3 className="font-semibold text-white">
                  Upload Document (Train AI)
                </h3>
                <p className="text-sm" style={{ color: "#9aa7a4" }}>
                  Supported:{" "}
                  <strong style={{ color: "#10b981" }}>
                    PDF, TXT, DOCX, MD, CSV, XLSX
                  </strong>{" "}
                  — max 10 MB
                  <br />
                  <span style={{ color: "#f59e0b" }}>
                    ⚠️ Images go to <strong>Media Library</strong> (not here).
                    PPT → export as PDF first. XLSX → CSV if extract fails.
                  </span>
                </p>
                <div
                  className="rounded-xl p-8 flex flex-col items-center gap-3 cursor-pointer"
                  style={{
                    border: "2px dashed #2a2a32",
                    background: "#1a1a20",
                  }}
                  onClick={() =>
                    !uploading &&
                    document.getElementById("file-upload-input").click()
                  }
                >
                  <div className="text-3xl">{uploading ? "⏳" : "📂"}</div>
                  <div className="text-sm font-medium text-white">
                    {uploading ? "Processing..." : "Click to choose a file"}
                  </div>
                  <div className="text-xs" style={{ color: "#9aa7a4" }}>
                    PDF · TXT · DOCX · MD · CSV · XLSX
                  </div>
                  <input
                    id="file-upload-input"
                    type="file"
                    accept=".pdf,.txt,.docx,.md,.csv,.xlsx,.xls"
                    style={{ display: "none" }}
                    onChange={uploadFile}
                    disabled={uploading}
                  />
                </div>
                {/* When to use note for file upload */}
                <div>
                  <label
                    className="text-xs font-medium mb-1 block"
                    style={{ color: "#f59e0b" }}
                  >
                    🎯 When should Bijou use this? (Optional but recommended)
                  </label>
                  <input
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    placeholder="e.g. customer asks about pricing, unit layout, refund policy"
                    className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                    style={{
                      background: "#233033",
                      border: "1px solid #2a2a32",
                    }}
                  />
                  <p className="text-xs mt-1" style={{ color: "#4b5563" }}>
                    Bijou gets smarter about <em>when</em> to use this doc.
                  </p>
                </div>
                {fileUploadStatus && (
                  <div
                    className="text-sm font-medium"
                    style={{
                      color: fileUploadStatus.startsWith("✅")
                        ? "#10b981"
                        : "#ef4444",
                    }}
                  >
                    {fileUploadStatus}
                  </div>
                )}
              </div>
            )}

            {tab === "import" && (
              <div
                className="rounded-xl p-5 space-y-4"
                style={{ background: "#12181a", border: "1px solid #233033" }}
              >
                <h3 className="font-semibold text-white">🏠 Import Property Listing</h3>
                <p className="text-sm" style={{ color: "#9aa7a4" }}>
                  Paste a PropertyGuru, iProperty, EdgeProp, or any listing URL.
                  Bijou AI will extract and format the details automatically.
                </p>

                {!importNeedsPaste ? (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-medium mb-1 block" style={{ color: "#9ca3af" }}>
                        Listing URL
                      </label>
                      <input
                        value={importUrl}
                        onChange={(e) => setImportUrl(e.target.value)}
                        placeholder="https://www.propertyguru.com.my/listing/..."
                        className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                        style={{ background: "#233033", border: "1px solid #2a2a32" }}
                        disabled={importLoading}
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium mb-1 block" style={{ color: "#f59e0b" }}>
                        Agent Note (optional)
                      </label>
                      <input
                        value={importNote}
                        onChange={(e) => setImportNote(e.target.value)}
                        placeholder="e.g. This is our flagship project in Petaling Jaya"
                        className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
                        style={{ background: "#233033", border: "1px solid #2a2a32" }}
                        disabled={importLoading}
                      />
                    </div>
                    <button
                      onClick={importListing}
                      disabled={importLoading || !importUrl.trim()}
                      className="w-full py-2.5 rounded-lg text-sm font-semibold transition-colors"
                      style={{
                        background: importLoading || !importUrl.trim() ? "#233033" : "#10b981",
                        color: importLoading || !importUrl.trim() ? "#4b5563" : "#000",
                      }}
                    >
                      {importLoading ? "⏳ Importing..." : "🏠 Import Listing"}
                    </button>
                    <p className="text-xs text-center" style={{ color: "#4b5563" }}>
                      If the page can't be scraped, you'll be asked to paste the text instead.
                    </p>
