                ) : (
                  <div className="space-y-3">
                    <div
                      className="rounded-lg p-3"
                      style={{ background: "#f59e0b15", border: "1px solid #f59e0b40" }}
                    >
                      <p className="text-xs font-medium" style={{ color: "#f59e0b" }}>
                        ⚠️ {importResult?.message}
                      </p>
                      <p className="text-xs mt-1" style={{ color: "#9aa7a4" }}>
                        Copy the listing text from the page and paste it below instead.
                      </p>
                    </div>
                    <div>
                      <label className="text-xs font-medium mb-1 block" style={{ color: "#9ca3af" }}>
                        Paste Listing Text
                      </label>
                      <textarea
                        value={importText}
                        onChange={(e) => setImportText(e.target.value)}
                        placeholder="Paste the full listing text here — name, price, size, location, facilities..."
                        rows={8}
                        className="w-full px-3 py-2 rounded-lg text-sm text-white outline-none resize-none"
                        style={{ background: "#233033", border: "1px solid #2a2a32" }}
                        disabled={importLoading}
                      />
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => { setImportNeedsPaste(false); setImportResult(null); }}
                        className="flex-1 py-2 rounded-lg text-sm font-medium"
                        style={{ background: "#233033", color: "#9ca3af", border: "1px solid #2a2a32" }}
                      >
                        ← Try URL Again
                      </button>
                      <button
                        onClick={importListingText}
                        disabled={importLoading || !importText.trim()}
                        className="flex-1 py-2.5 rounded-lg text-sm font-semibold"
                        style={{
                          background: importLoading || !importText.trim() ? "#233033" : "#10b981",
                          color: importLoading || !importText.trim() ? "#4b5563" : "#000",
                        }}
                      >
                        {importLoading ? "⏳ Saving..." : "✅ Save to AI"}
                      </button>
                    </div>
                  </div>
                )}

                {importResult && (
                  <div
                    className="text-sm font-medium rounded-lg px-3 py-2"
                    style={{
                      color: importResult.success ? "#10b981" : "#f59e0b",
                      background: importResult.success ? "#10b98112" : "#f59e0b12",
                      border: `1px solid ${importResult.success ? "#10b98133" : "#f59e0b33"}`,
                    }}
                  >
                    {importResult.message}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: LEAD CRM
      // ════════════════════════════════════════════════════════════════════════════
      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: CONTACTS CRM
      // ════════════════════════════════════════════════════════════════════════════
      // TAG_COLORS is defined globally above (used by both CRM and Inbox modules)
      const ALL_TAGS = [
        "lead",
        "inquiry",
        "hot_lead",
        "customer",
        "vip",
        "blocked",
      ];

      function LeadsModule() {
        const [contacts, setContacts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filter, setFilter] = useState("all");
        const [search, setSearch] = useState("");
        const [editingJid, setEditingJid] = useState(null); // jid being tag-edited
        const [editTag, setEditTag] = useState("");
        const [editNotes, setEditNotes] = useState("");
        const [editName, setEditName] = useState("");
        const [saving, setSaving] = useState(false);
        const [showAdd, setShowAdd] = useState(false);
        const [addForm, setAddForm] = useState({
          phone: "",
          name: "",
          tag: "lead",
          notes: "",
        });
        const [adding, setAdding] = useState(false);
        const [err, setErr] = useState("");
        const [importingCsv, setImportingCsv] = useState(false);
        const importInputRef = React.useRef(null);
        const lang = useLang(); const tl = k => T[lang][k] ?? T.en[k] ?? k;

        const load = () => {
          setLoading(true);
          const qs = filter !== "all" ? `?tag=${filter}` : "";
          api(`/api/contacts${qs}`)
            .then((d) => {
              setContacts(d.contacts || []);
            })
            .catch(() => setContacts([]))
            .finally(() => setLoading(false));
        };

        useEffect(() => {
          load();
        }, [filter]);

        const displayed = search
          ? contacts.filter(
              (c) =>
                (c.name || "").toLowerCase().includes(search.toLowerCase()) ||
                (c.phone || "").includes(search),
            )
          : contacts;

        const startEdit = (c) => {
          setEditingJid(c.jid);
          setEditTag(c.tag || "lead");
          setEditNotes(c.notes || "");
          setEditName(c.name || "");
        };

        const saveEdit = async (jid) => {
          setSaving(true);
          try {
            await api(`/api/contacts/${encodeURIComponent(jid)}`, {
              method: "PATCH",
              body: JSON.stringify({
                tag: editTag,
                notes: editNotes,
                name: editName,
              }),
            });
            setContacts((prev) =>
              prev.map((c) =>
                c.jid === jid
                  ? { ...c, tag: editTag, notes: editNotes, name: editName }
                  : c,
              ),
            );
            setEditingJid(null);
          } catch (e) {
            showToast("Save failed");
          } finally {
            setSaving(false);
          }
        };

        const deleteContact = async (jid, name) => {
          if (!confirm(`Remove "${name}" from contacts?`)) return;
          try {
            await api(`/api/contacts/${encodeURIComponent(jid)}`, {
              method: "DELETE",
            });
            setContacts((prev) => prev.filter((c) => c.jid !== jid));
          } catch (e) {
            showToast("Delete failed");
          }
        };

        const addContact = async () => {
          if (!addForm.phone.trim()) {
            setErr("Phone is required");
            return;
          }
          setAdding(true);
          setErr("");
          const jid = addForm.phone.replace(/\D/g, "") + "@s.whatsapp.net";
          try {
            await api("/api/contacts", {
              method: "POST",
              body: JSON.stringify({
                jid,
                phone: addForm.phone,
                name: addForm.name,
                tag: addForm.tag,
                notes: addForm.notes,
                source: "manual",
              }),
            });
            setShowAdd(false);
            setAddForm({ phone: "", name: "", tag: "lead", notes: "" });
            load();
          } catch (e) {
            setErr("Failed to add contact");
          } finally {
            setAdding(false);
          }
        };

        const exportContacts = async () => {
          try {
            const res = await fetch(
              `/api/contacts/export.csv?tenant_id=${TENANT_ID}&token=${TOKEN}`,
              {
                headers: authHeaders(),
              },
            );
            if (!res.ok) throw new Error("Export failed");
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "bijou_contacts.csv";
            a.click();
            URL.revokeObjectURL(url);
            showToast("Contacts exported!", "success");
          } catch (e) {
            showToast("Export failed", "error");
          }
        };

        const importContacts = async (file) => {
          if (!file) return;
          setImportingCsv(true);
          try {
            const form = new FormData();
            form.append("file", file);
            const res = await fetch(
              `/api/contacts/import?tenant_id=${TENANT_ID}&token=${TOKEN}`,
              {
                method: "POST",
                headers: authHeaders(),
                body: form,
              },
            );
            const d = await res.json();
            if (!res.ok) throw new Error(d.detail || "Import failed");
            showToast(
              `Imported ${d.imported} contacts${d.skipped ? `, ${d.skipped} skipped` : ""}`,
              "success",
            );
            load();
          } catch (e) {
            showToast(e.message || "Import failed", "error");
          } finally {
            setImportingCsv(false);
            if (importInputRef.current) importInputRef.current.value = "";
          }
        };

        const fmtDate = (ts) =>
          ts
            ? new Date(ts).toLocaleDateString("en-MY", {
                day: "numeric",
                month: "short",
              })
            : "—";

        return (
          <div className="space-y-4 fade-in">
            {/* Toolbar */}
            {(() => { const lang = useLang(); const t = k => T[lang][k] ?? T.en[k] ?? k; return (
            <div className="space-y-2">
              {/* Row 1: search + action buttons */}
              <div className="flex items-center gap-2">
                <input
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder={t("search_contacts")}
                  className="flex-1 min-w-0 px-3 py-2 rounded-lg text-sm outline-none"
                  style={{ background:"#12181a", border:"1px solid #233033", color:"#e5e7eb" }}
                />
                <button
                  onClick={() => { setShowAdd(true); setErr(""); }}
                  className="flex-shrink-0 px-3 py-2 rounded-lg text-xs font-semibold"
                  style={{ background:"#10b981", color:"#000", whiteSpace:"nowrap" }}
                >
                  {t("add_contact")}
                </button>
                <button
                  onClick={exportContacts}
                  className="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-base"
                  style={{ background:"#233033", color:"#9ca3af", border:"1px solid #2a2a32" }}
                  title={t("export_csv")}
                >
                  ↓
                </button>
                <button
                  onClick={() => importInputRef.current?.click()}
                  disabled={importingCsv}
                  className="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-base"
                  style={{ background:"#233033", color: importingCsv?"#4b5563":"#9ca3af", border:"1px solid #2a2a32" }}
                  title={t("import_csv")}
                >
                  {importingCsv ? "…" : "↑"}
                </button>
                <input ref={importInputRef} type="file" accept=".csv" className="hidden" onChange={(e) => importContacts(e.target.files?.[0])} />
              </div>
              {/* Row 2: filter chips scrollable */}
              <div className="flex gap-1.5 overflow-x-auto pb-0.5" style={{ scrollbarWidth:"none" }}>
                {["all", ...ALL_TAGS].map((tg) => (
                  <button
                    key={tg}
                    onClick={() => setFilter(tg)}
                    className="flex-shrink-0 px-2.5 py-1 rounded-md text-xs font-medium capitalize"
                    style={{
                      background: filter===tg ? (TAG_COLORS[tg]||"#10b981")+"22" : "#12181a",
                      color: filter===tg ? TAG_COLORS[tg]||"#10b981" : "#9aa7a4",
                      border: "1px solid " + (filter===tg ? (TAG_COLORS[tg]||"#10b981")+"55" : "#233033"),
                    }}
                  >
                    {tg==="all" ? `${t("all")} (${contacts.length})` : tg.replace("_"," ")}
                  </button>
                ))}
              </div>
            </div>
            ); })()}

            {/* Add contact modal */}
            {showAdd && (
              <div
                className="fixed inset-0 z-50 flex items-center justify-center"
                style={{ background: "rgba(0,0,0,0.7)" }}
              >
                <div
                  className="rounded-xl p-6 w-full max-w-sm space-y-4"
                  style={{ background: "#12181a", border: "1px solid #233033" }}
                >
                  <h3 className="font-semibold text-white">Add Contact</h3>
                  {err && (
                    <p className="text-xs" style={{ color: "#ef4444" }}>
                      {err}
                    </p>
                  )}
                  {[
                    ["Phone *", "phone", "text", "+60123456789"],
                    ["Name", "name", "text", "Ali bin Ahmad"],
                    ["Notes", "notes", "text", "Interested in Lot 3A"],
                  ].map(([label, key, type, ph]) => (
                    <div key={key}>
                      <label
                        className="text-xs mb-1 block"
                        style={{ color: "#9aa7a4" }}
                      >
                        {label}
                      </label>
                      <input
                        type={type}
                        placeholder={ph}
                        value={addForm[key]}
                        onChange={(e) =>
                          setAddForm((f) => ({ ...f, [key]: e.target.value }))
                        }
                        className="w-full px-3 py-2 rounded-lg text-sm outline-none"
                        style={{
                          background: "#0c1211",
                          border: "1px solid #233033",
                          color: "#e5e7eb",
                        }}
                      />
                    </div>
                  ))}
                  <div>
                    <label
                      className="text-xs mb-1 block"
                      style={{ color: "#9aa7a4" }}
                    >
                      Tag
                    </label>
                    <select
                      value={addForm.tag}
                      onChange={(e) =>
                        setAddForm((f) => ({ ...f, tag: e.target.value }))
                      }
                      className="w-full px-3 py-2 rounded-lg text-sm outline-none"
                      style={{
                        background: "#0c1211",
                        border: "1px solid #233033",
                        color: "#e5e7eb",
                      }}
                    >
                      {ALL_TAGS.map((t) => (
                        <option key={t} value={t}>
                          {t.replace("_", " ")}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button
                      onClick={() => setShowAdd(false)}
                      className="flex-1 py-2 rounded-lg text-xs"
                      style={{
                        background: "#0c1211",
                        border: "1px solid #233033",
                        color: "#9aa7a4",
                      }}
                    >
                      Cancel
                    </button>
                    <button
                      onClick={addContact}
                      disabled={adding}
                      className="flex-1 py-2 rounded-lg text-xs font-semibold"
                      style={{ background: "#10b981", color: "#000" }}
                    >
                      {adding ? "Adding…" : "Add"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Table */}
            <div
              className="rounded-xl overflow-hidden"
              style={{ background: "#12181a", border: "1px solid #233033" }}
            >
              <div
                className="px-5 py-4 border-b flex items-center justify-between"
                style={{ borderColor: "#233033" }}
              >
                <h3 className="font-semibold text-white">{tl("contacts_crm")}</h3>
                <span className="text-xs" style={{ color: "#4b5563" }}>
                  {displayed.length} shown
                </span>
              </div>

              {loading ? (
                <Spinner />
              ) : displayed.length === 0 ? (
                <Empty
                  emoji="👥"
                  title="No contacts yet"
                  desc="Contacts are auto-saved from every WhatsApp message. Or add one manually."
                />
              ) : (
                <div className="divide-y" style={{ borderColor: "#233033" }}>
                  {displayed.map((c) => (
                    <div key={c.jid}>
                      {/* Normal row */}
                      {editingJid !== c.jid ? (
                        <div className="px-5 py-3.5 flex items-center gap-3">
                          <div
                            className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
                            style={{
                              background:
                                (TAG_COLORS[c.tag] || "#10b981") + "20",
                              color: TAG_COLORS[c.tag] || "#10b981",
                            }}
                          >
                            {(c.name || c.phone || "?")[0].toUpperCase()}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-medium text-white truncate">
                                {c.name || c.phone || c.jid}
                              </span>
                              <span
                                className="text-xs px-1.5 py-0.5 rounded font-medium capitalize flex-shrink-0"
                                style={{
                                  background:
                                    (TAG_COLORS[c.tag] || "#9aa7a4") + "20",
                                  color: TAG_COLORS[c.tag] || "#9aa7a4",
                                }}
                              >
                                {(c.tag || "lead").replace("_", " ")}
                              </span>
                            </div>
                            <div
                              className="text-xs mt-0.5 flex items-center gap-3"
                              style={{ color: "#9aa7a4" }}
                            >
                              <span>{c.phone}</span>
                              {c.notes && (
                                <span className="truncate max-w-xs italic">
                                  {c.notes}
                                </span>
                              )}
                              <span className="flex-shrink-0">
                                last: {fmtDate(c.last_message_at)}
                              </span>
                              {c.message_count > 0 && (
                                <span>{c.message_count} msgs</span>
                              )}
                            </div>
                          </div>
                          <div className="flex gap-1.5 flex-shrink-0">
                            <button
                              onClick={() => startEdit(c)}
                              className="px-2 py-1 rounded text-xs"
                              style={{
                                background: "#233033",
                                color: "#9ca3af",
                              }}
                            >
                              Edit
                            </button>
                            <button
                              onClick={() =>
                                deleteContact(c.jid, c.name || c.phone)
                              }
                              className="px-2 py-1 rounded text-xs"
                              style={{
                                background: "#ef444415",
                                color: "#ef4444",
                              }}
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ) : (
                        /* Edit row */
                        <div
                          className="px-5 py-3 space-y-2"
                          style={{ background: "#0c1211" }}
                        >
                          <div className="flex gap-2 items-center flex-wrap">
                            <input
                              value={editName}
                              onChange={(e) => setEditName(e.target.value)}
                              placeholder={c.phone || "Contact name…"}
                              className="px-2 py-1 rounded text-xs outline-none"
                              style={{
                                background: "#12181a",
                                border: "1px solid #2a2a32",
                                color: "#e5e7eb",
                                minWidth: "120px",
                              }}
                            />
                            <select
                              value={editTag}
                              onChange={(e) => setEditTag(e.target.value)}
                              className="px-2 py-1 rounded text-xs outline-none"
                              style={{
                                background: "#12181a",
                                border: "1px solid #233033",
                                color: "#e5e7eb",
                              }}
                            >
                              {ALL_TAGS.map((t) => (
                                <option key={t} value={t}>
                                  {t.replace("_", " ")}
                                </option>
                              ))}
                            </select>
                          </div>
                          <input
                            value={editNotes}
                            onChange={(e) => setEditNotes(e.target.value)}
                            placeholder="Notes (optional)"
                            className="w-full px-3 py-1.5 rounded text-xs outline-none"
                            style={{
                              background: "#12181a",
                              border: "1px solid #233033",
                              color: "#e5e7eb",
                            }}
                          />
                          <div className="flex gap-2">
                            <button
                              onClick={() => setEditingJid(null)}
                              className="px-3 py-1 rounded text-xs"
                              style={{
                                background: "#233033",
                                color: "#9aa7a4",
                              }}
                            >
                              Cancel
                            </button>
                            <button
                              onClick={() => saveEdit(c.jid)}
                              disabled={saving}
                              className="px-3 py-1 rounded text-xs font-semibold"
                              style={{ background: "#10b981", color: "#000" }}
                            >
                              {saving ? "Saving…" : "Save"}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // MODULE: CALL BOOKING
      // ════════════════════════════════════════════════════════════════════════════
      function CallsModule() {
        const [bookings, setBookings] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filter, setFilter] = useState("all");
        const [showBookingForm, setShowBookingForm] = useState(false);
        const [activeTab, setActiveTab] = useState("bookings"); // 'bookings' or 'availability'

        // Booking form state
        const [formData, setFormData] = useState({
          customer_jid: "",
          customer_name: "",
          customer_phone: "",
          scheduled_time: "",
          duration_minutes: 30,
          call_type: "consultation",
          notes: "",
        });
        const [bookingLoading, setBookingLoading] = useState(false);
        const [availableSlots, setAvailableSlots] = useState([]);
        const [availabilityLoading, setAvailabilityLoading] = useState(false);

        // Availability management state
        const [weeklySchedule, setWeeklySchedule] = useState([]);
        const [holidays, setHolidays] = useState([]);
        const [settings, setSettings] = useState({
          timezone: "Asia/Kuala_Lumpur",
          buffer_minutes: 15,
          max_calls_per_day: 8,
          max_calls_per_hour: 2,
          advance_booking_days: 30,
          allow_same_day_booking: true,
        });
        const [showAvailabilityForm, setShowAvailabilityForm] = useState(false);
        const [showHolidayForm, setShowHolidayForm] = useState(false);
        const [availabilitySettings, setAvailabilitySettings] = useState(false);
        const [editingSettings, setEditingSettings] = useState(false);
        const [settingsDraft, setSettingsDraft] = useState(null);
        const [savingSettings, setSavingSettings] = useState(false);
        const [fabOpen, setFabOpen] = useState(false); // speed-dial open state
        const lang = useLang(); const tc = k => T[lang][k] ?? T.en[k] ?? k;

        useEffect(() => {
          if (activeTab === "bookings") {
            loadBookings();
          } else if (activeTab === "availability") {
            loadAvailabilitySchedule();
          }
        }, [activeTab]);

        async function loadBookings() {
          try {
            const data = await api("/api/call-booking/list", {
              headers: { "X-Tenant-ID": TENANT_ID },
            });
            setBookings(Array.isArray(data) ? data : data.bookings || []);
          } catch (error) {
            console.error("Failed to load bookings:", error);
            setBookings([]);
          } finally {
            setLoading(false);
          }
        }

        async function loadAvailabilitySchedule() {
          try {
            setLoading(true);
            const data = await api("/api/call-booking/availability/schedule", {
              headers: { "X-Tenant-ID": TENANT_ID },
            });
            setWeeklySchedule(data.weekly_schedule || []);
            setHolidays(data.holidays || []);
            setSettings({ ...settings, ...data.settings });
          } catch (error) {
            console.error("Failed to load availability schedule:", error);
          } finally {
            setLoading(false);
          }
        }

        async function loadAvailableSlots() {
          if (!formData.scheduled_time) return;

          try {
            setAvailabilityLoading(true);
            const selectedDate = formData.scheduled_time.split("T")[0];
            const endDate = selectedDate; // Same day for now

            const data = await api(
              `/api/call-booking/available-slots?start_date=${selectedDate}&end_date=${endDate}&duration_minutes=${formData.duration_minutes}`,
              {
                headers: authHeaders(),
              },
            );
            setAvailableSlots(data.available_slots || []);
          } catch (error) {
            console.error("Failed to load available slots:", error);
            setAvailableSlots([]);
          } finally {
            setAvailabilityLoading(false);
          }
        }

        async function handleBookCall() {
          if (!formData.customer_jid || !formData.scheduled_time) {
            showToast(
              "Please fill in the customer JID and scheduled time.",
              "warning",
            );
            return;
          }

          setBookingLoading(true);
          try {
            await api("/api/call-booking/book", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Tenant-ID": TENANT_ID,
              },
              body: JSON.stringify(formData),
            });

            setShowBookingForm(false);
            setFormData({
              customer_jid: "",
              customer_name: "",
              customer_phone: "",
              scheduled_time: "",
              duration_minutes: 30,
              call_type: "consultation",
              notes: "",
            });
            await loadBookings();
          } catch (error) {
            console.error("Failed to book call:", error);
            if (error.message.includes("409")) {
              showToast(
                "This time slot is not available. Please select another slot.",
                "warning",
              );
            } else {
              showToast("Failed to book call. Please try again.");
            }
          } finally {
            setBookingLoading(false);
          }
        }

        async function saveSettings() {
          if (!settingsDraft) return;
          setSavingSettings(true);
          try {
            await api("/api/call-booking/availability/settings", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "X-Tenant-ID": TENANT_ID,
              },
              body: JSON.stringify(settingsDraft),
            });
            setSettings(settingsDraft);
            setEditingSettings(false);
            showToast("Call settings saved.", "success");
          } catch (e) {
            showToast("Failed to save settings.", "error");
          } finally {
            setSavingSettings(false);
          }
        }

                      className="px-5 py-4 border-b"
                      style={{ borderColor: "#233033" }}
                    >
                      <h3 className="font-semibold text-white">
                        🏖️ Holidays & Exceptions
                      </h3>

                    <div className="p-5">
                      <div className="space-y-2">
                        {holidays.map((holiday, index) => (
                          <div
                            key={index}
                            className="flex items-center justify-between py-2 px-3 rounded-lg"
                            style={{ background: "#0a0f0e" }}
                          >
                            <div>
                              <div className="font-medium text-white">
                                {holiday.title || "Holiday"}
                              </div>
                              <div className="text-sm text-gray-400">
                                {holiday.date}
                              </div>
                            </div>
                            {holiday.is_recurring && (
                              <div className="text-xs text-yellow-400">
                                Recurring
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Booking Form Modal */}
            {showBookingForm && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div className="bg-gray-900 rounded-xl p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
                  <h3 className="text-lg font-semibold text-white mb-4">
                    📞 Book New Call
                  </h3>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Customer WhatsApp ID
                      </label>
                      <input
                        type="text"
                        value={formData.customer_jid}
                        onChange={(e) =>
                          setFormData({
                            ...formData,
                            customer_jid: e.target.value,
                          })
                        }
                        placeholder="60174106981@s.whatsapp.net"
                        className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Customer Name
                      </label>
                      <input
                        type="text"
                        value={formData.customer_name}
                        onChange={(e) =>
                          setFormData({
                            ...formData,
                            customer_name: e.target.value,
                          })
                        }
                        placeholder="John Doe"
                        className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Phone Number
                      </label>
                      <input
                        type="text"
                        value={formData.customer_phone}
                        onChange={(e) =>
                          setFormData({
                            ...formData,
                            customer_phone: e.target.value,
                          })
                        }
                        placeholder="+60174106981"
                        className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                      />
                    </div>

                    <div className="flex gap-4">
                      <div className="flex-1">
                        <label className="block text-sm font-medium text-gray-300 mb-1">
                          Duration (minutes)
                        </label>
                        <select
                          value={formData.duration_minutes}
                          onChange={(e) => {
                            setFormData({
                              ...formData,
                              duration_minutes: parseInt(e.target.value),
                            });
                            // Reload available slots when duration changes
                            if (formData.scheduled_time) {
                              setTimeout(loadAvailableSlots, 100);
                            }
                          }}
                          className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                        >
                          <option value={15}>15 minutes</option>
                          <option value={30}>30 minutes</option>
                          <option value={45}>45 minutes</option>
                          <option value={60}>1 hour</option>
                          <option value={90}>1.5 hours</option>
                        </select>
                      </div>

                      <div className="flex-1">
                        <label className="block text-sm font-medium text-gray-300 mb-1">
                          Call Type
                        </label>
                        <select
                          value={formData.call_type}
                          onChange={(e) =>
                            setFormData({
                              ...formData,
                              call_type: e.target.value,
                            })
                          }
                          className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                        >
                          {Object.entries(callTypes).map(([key, label]) => (
                            <option key={key} value={key}>
                              {label}
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Select Date
                      </label>
                      <input
                        type="date"
                        value={formData.scheduled_time.split("T")[0] || ""}
                        onChange={(e) => {
                          const time =
                            formData.scheduled_time.split("T")[1] || "09:00";
                          setFormData({
                            ...formData,
                            scheduled_time: `${e.target.value}T${time}`,
                          });
                          // Load available slots when date changes
                          setTimeout(loadAvailableSlots, 100);
                        }}
                        min={new Date().toISOString().split("T")[0]}
                        className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                      />
                    </div>

                    {/* Available Slots Section */}
                    {formData.scheduled_time.split("T")[0] && (
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <label className="block text-sm font-medium text-gray-300">
                            Available Time Slots
                          </label>
                          {availabilityLoading && (
                            <div className="text-xs text-gray-400">
                              Loading slots...
                            </div>
                          )}
                        </div>

                        {availableSlots.length === 0 && !availabilityLoading ? (
                          <div className="p-3 bg-red-900/20 border border-red-500/20 rounded-lg text-red-300 text-sm">
                            ❌ No available slots for this date. Please select
                            another date or check your availability settings.
                          </div>
                        ) : (
                          <div className="grid grid-cols-3 gap-2 max-h-32 overflow-y-auto">
                            {availableSlots.map((slot, index) => {
                              const slotDateTime = `${slot.date}T${slot.start_time}`;
                              const isSelected =
                                formData.scheduled_time === slotDateTime;
                              return (
                                <button
                                  key={index}
                                  onClick={() =>
                                    setFormData({
                                      ...formData,
                                      scheduled_time: slotDateTime,
                                    })
                                  }
                                  className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                    isSelected
                                      ? "bg-emerald-500 text-black"
                                      : "bg-gray-700 text-white hover:bg-gray-600"
                                  }`}
                                >
                                  {slot.start_time}
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}

                    {/* Manual Time Input (fallback) */}
                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Or Set Custom Time
                        <span className="text-xs text-gray-500 ml-1">
                          (may be rejected if unavailable)
                        </span>
                      </label>
                      <input
                        type="time"
                        value={formData.scheduled_time.split("T")[1] || ""}
                        onChange={(e) => {
                          const date =
                            formData.scheduled_time.split("T")[0] ||
                            new Date().toISOString().split("T")[0];
                          setFormData({
                            ...formData,
                            scheduled_time: `${date}T${e.target.value}`,
                          });
                        }}
                        className="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-300 mb-1">
                        Notes (optional)

                      <textarea
                        value={formData.notes}
                        onChange={(e) =>
                          setFormData({ ...formData, notes: e.target.value })

                        rows={3}

                      />
                    </div>
                  </div>

                  <div className="flex gap-3 mt-6">
                    <button
                      onClick={() => setShowBookingForm(false)}
                      className="flex-1 px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors"
                      disabled={bookingLoading}
                    >
                      Cancel
                    </button>

                      onClick={handleBookCall}
                      disabled={
                        bookingLoading ||
                        !formData.customer_jid ||
                        !formData.scheduled_time

      // ════════════════════════════════════════════════════════════════════════════
      // MODULE: MEDIA LIBRARY
      // Client uploads branded assets (PDFs, images) that Bijou can attach when
      // matching customer questions. Add “when to send” keywords so Bijou knows.
      // ════════════════════════════════════════════════════════════════════════════
      function MediaModule() {
        const [files, setFiles] = useState([]);
        const [loading, setLoading] = useState(true);
        const [uploading, setUploading] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [editDesc, setEditDesc] = useState("");
        const [editTags, setEditTags] = useState("");
        const [savingMeta, setSavingMeta] = useState(false);
        const [preview, setPreview] = useState(null); // {url, type, name} | null
        const [previewLoading, setPreviewLoading] = useState(false);
        const fileRef = useRef(null);

        const openPreview = async (f) => {
          setPreviewLoading(true);
          try {
            const data = await api(`/api/media/${f.id}/url`);
            setPreview({ url: data.signed_url, type: f.file_type, name: f.original_name });
          } catch (e) {
            showToast("Preview failed: " + e.message);
          } finally {
            setPreviewLoading(false);
          }
        };

        const loadFiles = () => {
          setLoading(true);
          api("/api/media")
            .then((d) => setFiles(d.media || []))
            .catch(() => setFiles([]))
            .finally(() => setLoading(false));
        };

        useEffect(loadFiles, []);

        const handleUpload = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          setUploading(true);
          try {
            const fd = new FormData();
            fd.append("file", file);
            const res = await fetch(
              `/api/media/upload?tenant_id=${TENANT_ID}&token=${TOKEN}`,
              {
                method: "POST",
                headers: authHeaders(),
                body: fd,
              },
            );
            if (!res.ok) throw new Error(`Upload failed: HTTP ${res.status}`);
            loadFiles();
          } catch (err) {
            showToast("Upload failed: " + err.message);
          } finally {
            setUploading(false);
            if (fileRef.current) fileRef.current.value = "";
          }
        };

        const startEdit = (f) => {
          setEditingId(f.id);
          setEditDesc(f.description || "");
          setEditTags((f.tags || []).join(", "));
        };

        const saveMeta = async (id) => {
          setSavingMeta(true);
          try {
            const res = await fetch(
              `/api/media/${id}?tenant_id=${TENANT_ID}&token=${TOKEN}`,
              {
                method: "PATCH",
                headers: authHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({
                  description: editDesc,
                  tags: editTags
                    .split(",")
                    .map((t) => t.trim())
                    .filter(Boolean),
                }),
              },
            );
            if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}`);
            setEditingId(null);
            loadFiles();
          } catch (err) {
            showToast("Save failed: " + err.message);
          } finally {
            setSavingMeta(false);
          }
        };

        const deleteFile = async (id, name) => {
          if (!confirm(`Delete "${name}"?`)) return;
          try {
            await api(`/api/media/${id}`, { method: "DELETE" });
            loadFiles();
          } catch (err) {
            showToast("Delete failed: " + err.message);
          }
        };

        const FILE_TYPE_ICON = {
          image: "🖼️",
          pdf: "📕",
          video: "🎥",
          audio: "🎤",
          document: "📄",
        };

        return (
          <div className="p-4 sm:p-6 space-y-6">
            {/* Preview lightbox */}
            {preview && (
              <div
                className="fixed inset-0 z-50 flex items-center justify-center p-4"
                style={{ background: "rgba(0,0,0,0.85)" }}
                onClick={() => setPreview(null)}
              >
                <div
                  className="relative rounded-xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col"
                  style={{ background: "#12181a", border: "1px solid #233033" }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: "#233033" }}>
                    <span className="text-sm font-medium text-white truncate">{preview.name}</span>
                    <div className="flex gap-2 flex-shrink-0">
                      <a href={preview.url} target="_blank" rel="noopener noreferrer"
                        className="text-xs px-3 py-1 rounded-lg" style={{ background: "#233033", color: "#9ca3af" }}>
                        Open ↗
                      </a>
                      <button onClick={() => setPreview(null)}
                        className="text-xs px-3 py-1 rounded-lg" style={{ background: "#ef444415", color: "#ef4444" }}>
                        ✕ Close
                      </button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto p-4 flex items-center justify-center" style={{ minHeight: "300px" }}>
                    {preview.type === "image" && (
                      <img src={preview.url} alt={preview.name} className="max-w-full max-h-[70vh] rounded-lg object-contain" />
                    )}
                    {preview.type === "pdf" && (
                      <embed src={preview.url} type="application/pdf" className="w-full rounded-lg" style={{ height: "70vh" }} />
                    )}
                    {preview.type === "video" && (
                      <video controls src={preview.url} className="max-w-full max-h-[70vh] rounded-lg" />
                    )}
                    {preview.type === "audio" && (
                      <audio controls src={preview.url} className="w-full" />
                    )}
                    {!["image","pdf","video","audio"].includes(preview.type) && (
                      <div className="text-center space-y-3">
                        <div className="text-4xl">📄</div>
                        <p className="text-sm" style={{ color: "#9ca3af" }}>Preview not available for this file type.</p>
                        <a href={preview.url} target="_blank" rel="noopener noreferrer"
                          className="inline-block px-4 py-2 rounded-lg text-sm font-medium"
                          style={{ background: "#6366f1", color: "#fff" }}>Download File ↓</a>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h2 className="text-lg font-semibold text-white">
                  📎 Media Library
                </h2>
                <p className="text-sm mt-0.5" style={{ color: "#9aa7a4" }}>
                  Upload files for Bijou to attach when customers ask the right
                  questions.
                </p>
              </div>
              <label
                className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition-colors"
                style={{ background: "#10b981", color: "#000" }}
              >
                {uploading ? "Uploading…" : "+ Upload File"}
                <input
                  ref={fileRef}
                  type="file"
                  className="hidden"
                  accept="image/*,.pdf,.doc,.docx,.mp4,.mov"
                  onChange={handleUpload}
                  disabled={uploading}
                />
              </label>
            </div>

            {/* How-it-works callout */}
            <div
              className="rounded-xl p-4 text-sm"
              style={{ background: "#10b98110", border: "1px solid #10b98125" }}
            >
              <div className="font-medium mb-1" style={{ color: "#10b981" }}>
                💡 How it works
              </div>
              <ol className="space-y-1" style={{ color: "#9ca3af" }}>
                <li>
                  1. Upload your file (floor plan PDF, product image, brochure,
                  etc.)
                </li>
                <li>
                  2. Add a{" "}
                  <strong style={{ color: "#e5e7eb" }}>description</strong> —
                  what this file is about.
                </li>
                <li>
                  3. Set{" "}
                  <strong style={{ color: "#e5e7eb" }}>trigger keywords</strong>{" "}
                  — comma-separated words. When a customer asks something
                  matching these words, Bijou automatically attaches this file
                  to its reply.
                </li>
              </ol>
            </div>

            {/* File list */}
            {loading ? (
              <div className="text-center py-12" style={{ color: "#9aa7a4" }}>
                Loading…
              </div>
            ) : files.length === 0 ? (
              <div
                className="text-center py-12 rounded-xl"
                style={{ background: "#111114", color: "#9aa7a4" }}
              >
                No files uploaded yet. Upload your first file above.
              </div>
            ) : (
              <div className="space-y-3">
                {files.map((f) => (
                  <div
                    key={f.id}
                    className="rounded-xl p-4 space-y-3"
                    style={{
                      background: "#111114",
                      border: "1px solid #233033",
                    }}
                  >
                    {/* File header row */}
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex items-center gap-2 min-w-0">
                        <span className="text-xl flex-shrink-0">
                          {FILE_TYPE_ICON[f.file_type] || "📄"}
                        </span>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-white truncate">
                            {f.original_name}
                          </div>
                          <div
                            className="text-xs mt-0.5"
                            style={{ color: "#9aa7a4" }}
                          >
                            {f.file_type} • sent {f.send_count || 0}×
                            {f.created_at &&
                              " • " +
                                new Date(f.created_at).toLocaleDateString()}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <button
                          onClick={() => openPreview(f)}
                          disabled={previewLoading}
                          className="px-3 py-1.5 text-xs rounded-lg transition-colors"
                          style={{ background: "#233033", color: "#9ca3af" }}
                        >
                          {previewLoading ? "⏳" : "👁 Preview"}
                        </button>
                        {editingId !== f.id && (
                          <button
                            onClick={() => startEdit(f)}
                            className="px-3 py-1.5 text-xs rounded-lg transition-colors"
                            style={{ background: "#233033", color: "#9ca3af" }}
                          >
                            Edit
                          </button>
                        )}
                        <button
                          onClick={() => deleteFile(f.id, f.original_name)}
                          className="px-3 py-1.5 text-xs rounded-lg transition-colors"
                          style={{ background: "#ef444415", color: "#ef4444" }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>

                    {/* Description + tags display or edit */}
                    {editingId === f.id ? (
                      <div className="space-y-2">
                        <div>
                          <label
                            className="text-xs font-medium block mb-1"
                            style={{ color: "#9ca3af" }}
                          >
                            Description (what is this file?)
                          </label>
                          <input
                            className="w-full rounded-lg px-3 py-2 text-sm text-white outline-none"
                            style={{
                              background: "#233033",
                              border: "1px solid #2d2d35",
                            }}
                            placeholder="e.g. Floor plan for Unit A, 3-bedroom layout"
                            value={editDesc}
                            onChange={(e) => setEditDesc(e.target.value)}
                          />
                        </div>
                        <div>
                          <label
                            className="text-xs font-medium block mb-1"
                            style={{ color: "#9ca3af" }}
                          >
                            Trigger keywords — comma separated (Bijou sends this
                            file when customer asks about these)
                          </label>
                          <input
                            className="w-full rounded-lg px-3 py-2 text-sm text-white outline-none"
                            style={{
                              background: "#233033",
                              border: "1px solid #2d2d35",
                            }}
                            placeholder="e.g. floor plan, layout, size, room"
                            value={editTags}
                            onChange={(e) => setEditTags(e.target.value)}
                          />
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => saveMeta(f.id)}
                            disabled={savingMeta}
                            className="px-4 py-1.5 text-xs rounded-lg font-medium transition-colors"
                            style={{ background: "#10b981", color: "#000" }}
                          >
                            {savingMeta ? "Saving…" : "Save"}
                          </button>
                          <button
                            onClick={() => setEditingId(null)}
                            className="px-4 py-1.5 text-xs rounded-lg transition-colors"
                            style={{ background: "#233033", color: "#9ca3af" }}
                          >
                            Cancel
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-1">
                        {f.description && (
                          <div className="text-sm" style={{ color: "#9ca3af" }}>
                            {f.description}
                          </div>
                        )}
                        {(f.tags || []).length > 0 && (
                          <div className="flex flex-wrap gap-1 mt-1">
                            {(f.tags || []).map((t) => (
                              <span
                                key={t}
                                className="px-2 py-0.5 rounded text-xs"
                                style={{
                                  background: "#10b98118",
                                  color: "#10b981",
                                  border: "1px solid #10b98125",
                                }}
                              >
                                {t}
                              </span>
                            ))}
                          </div>
                        )}
                        {!f.description && (!f.tags || f.tags.length === 0) && (
                          <div
                            className="text-xs italic"
                            style={{ color: "#4b5563" }}
                          >
                            No description or trigger keywords set — click Edit
                            to configure.
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════
      // COMPONENT: WhatsApp Reconnect — live status + inline QR + auto-poll until linked
      // ════════════════════════════════════════════════════════════════════════════
      function WhatsAppReconnect() {
        const [status, setStatus] = useState(null); // null=loading; else {connected, phone_number, whatsapp_jid}
        const [qr, setQr] = useState(null);          // data-uri PNG
        const [linking, setLinking] = useState(false);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState(null);
        const pollRef = useRef(null);
        const qrRef = useRef(null);

        const loadStatus = useCallback(async () => {
          try {
            const s = await api("/api/dashboard/whatsapp/status");
            setStatus(s || { connected: false });
            return s;
          } catch (e) {
            setErr(e.message || "status check failed");
            return null;
          }
        }, []);

        const stopPolling = useCallback(() => {
          if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
          if (qrRef.current) { clearInterval(qrRef.current); qrRef.current = null; }
        }, []);

        // initial status + cleanup timers on unmount
        useEffect(() => { loadStatus(); return stopPolling; }, [loadStatus, stopPolling]);

        const fetchQr = useCallback(async () => {
          setErr(null);
          try {
            const r = await api("/api/dashboard/whatsapp/qr");
            if (r && r.qr) setQr(r.qr);
            else setErr((r && r.message) || "Could not load QR code (bridge unreachable?)");
          } catch (e) {
            setErr(e.message || "QR request failed");
          }
        }, []);

        const startLinking = useCallback(async () => {
          setBusy(true); setLinking(true);
          await fetchQr();
          setBusy(false);
          qrRef.current = setInterval(fetchQr, 20000);       // QR expires; refresh
          pollRef.current = setInterval(async () => {          // poll until live
            const s = await loadStatus();
            if (s && s.connected) {
              stopPolling(); setLinking(false); setQr(null);
              showToast("WhatsApp connected!", "success");
            }
          }, 3000);
        }, [fetchQr, loadStatus, stopPolling]);

        const cancelLinking = useCallback(() => {
          stopPolling(); setLinking(false); setQr(null);
        }, [stopPolling]);

        const connected = !!(status && status.connected);
        const phone = status && (status.phone_number || (status.whatsapp_jid || "").split("@")[0]);

        return (
          <div className="mt-4">
            <div className="flex items-center gap-2 mb-3">
              <span style={{ width: 10, height: 10, borderRadius: "50%",
                background: connected ? "#10b981" : "#ef4444",
                boxShadow: connected ? "0 0 8px #10b981" : "none", display: "inline-block" }} />
              <span style={{ fontSize: 14, color: "#e5e7eb", fontWeight: 500 }}>
                {status === null ? "Checking…"
                  : connected ? ("Connected" + (phone ? " · +" + phone : ""))
                  : "Disconnected"}
              </span>
              <button onClick={loadStatus} className="ml-auto text-xs px-2 py-1 rounded"
                style={{ background: "#ffffff08", color: "#9ca3af", border: "1px solid #ffffff14" }}>
                Refresh
              </button>
            </div>

            {!linking && (
              <button onClick={startLinking} disabled={busy}
                className="w-full px-4 py-2.5 rounded-lg text-sm font-medium"
                style={{ background: connected ? "#ffffff08" : "#10b981",
                  color: connected ? "#e5e7eb" : "#04121a",
                  border: connected ? "1px solid #ffffff14" : "none", opacity: busy ? 0.6 : 1 }}>
                {busy ? "Loading…" : connected ? "Re-link device (scan new QR)" : "Connect WhatsApp"}
              </button>
            )}

            {linking && (
              <div className="rounded-lg p-4 text-center" style={{ background: "#ffffff05", border: "1px solid #ffffff14" }}>
                {qr ? (
                  <>
                    <img src={qr} alt="WhatsApp QR code" width="220" height="220"
                      style={{ margin: "0 auto 12px", borderRadius: 8, background: "#fff", padding: 8 }} />
                    <p style={{ fontSize: 12, color: "#9aa7a4", lineHeight: 1.6, marginBottom: 10 }}>
                      On your phone: <strong style={{ color: "#e5e7eb" }}>WhatsApp &rarr; Settings &rarr; Linked Devices &rarr; Link a Device</strong>, then scan this code.
                    </p>
                    <div style={{ fontSize: 12, color: "#10b981", marginBottom: 12 }}>
                      &#9203; Waiting for you to scan&hellip;
                    </div>
                  </>
                ) : err ? (
                  <div style={{ padding: "4px 0" }}>
                    <div style={{ fontSize: 26, marginBottom: 8 }}>📴</div>
                    <p style={{ fontSize: 13, color: "#e5e7eb", fontWeight: 600, marginBottom: 6 }}>
                      Couldn&rsquo;t load the QR code
                    </p>
                    <p style={{ fontSize: 12, color: "#9aa7a4", lineHeight: 1.6, marginBottom: 8 }}>
                      The WhatsApp messaging service isn&rsquo;t reachable from this environment yet — a
                      WhatsApp bridge has to be connected before you can link a number.
                    </p>
                    <p style={{ fontSize: 11, color: "#7a8a87", marginBottom: 12, wordBreak: "break-word" }}>Details: {err}</p>
                    <button onClick={fetchQr} className="text-xs px-3 py-1.5 rounded mr-2"
                      style={{ background: "#10b98115", color: "#10b981", border: "1px solid #10b98130" }}>
                      Retry
                    </button>
                  </div>
                ) : (
                  <div style={{ padding: "40px 0" }}><Spinner /></div>
                )}
                <button onClick={cancelLinking} className="text-xs px-3 py-1.5 rounded"
                  style={{ background: "#ffffff08", color: "#9ca3af", border: "1px solid #ffffff14" }}>
                  Cancel
                </button>
              </div>
            )}

            {err && !linking && <p style={{ fontSize: 12, color: "#ef4444", marginTop: 8 }}>{err}</p>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════════

          setBlockLoading(true);
          setBlockMsg(null);
          try {
            await api("/api/dashboard/blacklist", {
              method: "POST",
              body: JSON.stringify({
                phone_number: phone,
                reason: blockReason || "Blocked via dashboard",
              }),

            setBlockInput("");
            setBlockReason("");
            setBlockMsg({ ok: true, text: `${phone} blocked` });
            const bl = await api("/api/dashboard/blacklist").catch(() => null);
            if (Array.isArray(bl)) setBlocklist(bl.filter((b) => b.is_active));
          } catch (e) {
            setBlockMsg({ ok: false, text: "Failed: " + e.message });
          }
          setBlockLoading(false);
        }

                          /* PKCE: generate code_verifier */
                          const array = new Uint8Array(64);
                          crypto.getRandomValues(array);
                          const codeVerifier = btoa(String.fromCharCode(...array))
                            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");

                          /* code_challenge = BASE64URL(SHA-256(verifier)) */
                          const digest = await crypto.subtle.digest(
                            "SHA-256",
                            new TextEncoder().encode(codeVerifier)
                          );
                          const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))

                          localStorage.setItem("cal_code_verifier", codeVerifier);
                          localStorage.setItem("cal_code_verifier_ts", Date.now().toString());

                          /* PKCE state for CSRF protection */
                          const stateArr = new Uint8Array(16);
                          crypto.getRandomValues(stateArr);
                          const state = btoa(String.fromCharCode(...stateArr)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
                          localStorage.setItem("cal_oauth_state", state);

                          const params = new URLSearchParams({
                            client_id: "3195ffcf36e5fbac1d894f625a96270418d36afb5578e051dae8b64330346652",
                            // Dynamic so local dev returns to localhost and prod returns to prod.

                            redirect_uri: window.location.origin + "/callback",
                            response_type: "code",
                            code_challenge: codeChallenge,
                            code_challenge_method: "S256",
                            state: state,
                          });
                          window.location.href = `https://app.cal.com/auth/oauth2/authorize?${params}`;
                        } catch (e) {
                          showToast("Could not start OAuth flow: " + e.message, "error");
                        }

                            btn.disabled = false;
                            btn.textContent = "Update Password";
                          }
                        }}
                        className="w-full px-4 py-2 rounded text-sm font-semibold"
                        style={{ background: "#6366f1", color: "#fff" }}
                      >
                        Update Password
                      </button>
                    </div>

                  <button
                    onClick={async () => {
                      if (accountEmail === "—") { showToast("No email on file — cannot send reset link", "error"); return; }
                      try {
                        await api("/api/auth/reset-password", { method: "POST", body: JSON.stringify({ email: accountEmail }) });
                        showToast("Password reset email sent to " + accountEmail, "success");
                      } catch (e) { showToast("Failed: " + e.message, "error"); }
                    }}
                    className="w-full px-4 py-2 rounded-lg text-xs"
                    style={{ background: "#23303380", color: "#9aa7a4", border: "1px solid #333" }}
                  >
                    📧 Send Password Reset Email Instead

          {

            desc: "Irreversible actions",
            content: (
              <div className="mt-4 space-y-2">

                      confirm(

                        "Feature coming soon — contact support to clear history.",
                        "info",

                  className="w-full px-4 py-2.5 rounded-lg text-sm font-medium text-left"
                  style={{
                    background: "#ef444410",
                    color: "#ef4444",
                    border: "1px solid #ef444430",
                  }}
                >
                  Clear Conversation History
                </button>
                <button
                  onClick={async () => {
                    if (
                      !confirm(
                        "Disconnect WhatsApp? The AI will stop responding. You will need to scan QR code again to reconnect.",
                      )
                    ) return;

                    try {
                      const response = await api("/api/dashboard/whatsapp/disconnect", {
                        method: "DELETE",

                      if (response.success) {
                        showToast(response.message || "WhatsApp disconnected successfully.", "success");

                        setTimeout(() => {

                        }, 2000);
                      } else {
                        showToast(response.message || "Failed to disconnect WhatsApp.", "error");

                      console.error("Disconnect error:", error);
                      showToast("Failed to disconnect WhatsApp. Please try again.", "error");

                  style={{
                    background: "#ef444410",
                    color: "#ef4444",

            <div className="space-y-3">

              style={{
                background: saved ? "#059669" : "#10b981",
