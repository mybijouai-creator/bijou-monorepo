name: backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'packages/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python + Node syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/backend/requirements.txt

      - name: Setup Node 20 (for .cjs scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy  # linters

      - name: Python syntax check (py_compile)
        run: |
          echo "--- py_compile all .py ---"
          find . -name '*.py' -not -path '*/__pycache__/*' -not -path '*/.venv/*' -exec python -m py_compile {} +
          echo "PASS: all .py compile"

      - name: Python lint (ruff) — errors BLOCK, style advisory
        run: |
          # Blocking tier: real errors only — undefined names, broken syntax,
          # f-string bugs. F821 means a guaranteed NameError when that line
          # runs, so it always gates.
          #
          # Covers 142 of 147 files under src/. The 5 exclusions carry
          # PRE-EXISTING F821 defects (found 2026-08-10) and are excluded so
          # this gate is green from day one and catches every NEW regression:
          #   src/core/bijou.py:5464            undefined `httpx`
          #   src/core/bijou.py:3100            undefined `msg_dict`  (logic bug)
          #   src/integrations/webhooks.py:68   undefined `logger`
          #   src/core/dashboard_api.py:119,223,335  undefined `SupabaseDB`
          #   src/saas/escalation_api.py:348,350     undefined `Enum`
          #   src/core/copilot_methods.py:37    undefined `Command`, `Optional`
          # tests/ has 6 more (e.g. tests/load/test_call_load.py:558 `os`).
          #
          # Fix these, then delete the matching --exclude line. Do NOT widen
          # the scope before they are green, or this gate gets deleted again.
          echo "--- blocking: ruff E9,F63,F7,F82 on src/ ---"
          ruff check src/ --select E9,F63,F7,F82 \
            --exclude src/core/bijou.py \
            --exclude src/core/copilot_methods.py \
            --exclude src/core/dashboard_api.py \
            --exclude src/integrations/webhooks.py \
            --exclude src/saas/escalation_api.py
          echo "PASS: no ruff errors in blocking scope (142/147 src files)"
          # Advisory tier: full ruleset, reported but non-blocking until the
          # existing backlog is cleared. Promote to blocking once green.
          echo "--- advisory: full ruff ---"
          ruff check src/ app/ scripts/ tests/ 2>&1 || echo "ruff style findings above (advisory)"

      - name: Python type check (mypy, lenient)
        run: |
          # Lenient on first pass — many legacy files lack type hints
          mypy src/ --ignore-missing-imports --no-strict-optional 2>&1 || echo "mypy had findings (review above)"
        continue-on-error: true

      - name: Node syntax check (.cjs)
        run: |
          echo "--- node --check all .cjs ---"
          find . -name '*.cjs' -exec node --check {} +
          echo "PASS: all .cjs valid"

      - name: Static HTML inline-JS syntax check (blocking)
        # 2026-08-22: login.html had a stray brace that broke its entire
        # inline <script> parse — invisible here because the step above only
        # globs *.cjs. A syntax error in these hand-written pages means the
        # login/signup/dashboard JS silently never runs in the browser while
        # the API still returns 200. tests/unit/test_static_html_js_syntax.py
        # extracts every plain-JS <script> block from static/*.html and runs
        # node --check on it.
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/unit/test_static_html_js_syntax.py -q

      - name: Node deps (for .cjs scripts that import npm packages)
        run: npm install --no-audit --no-fund --no-save

      # ───────────────────────────────────────────────────────────────
      # Tests. Added 2026-08-10 — this workflow previously ran NO tests
      # at all, so 439 existing tests never executed in CI and a change
      # that merely compiled could break auth or tenant isolation and
      # deploy straight to Fly. That is how a total signup outage shipped.
      #
      # Two tiers on purpose. As of 2026-08-10 `tests/unit/` has 44 failing
      # tests (219 pass) from pre-existing breakage; making the whole tier
      # blocking today would just get this step deleted again. So the
      # auth/OAuth suites — currently 15/15 green and covering the exact
      # paths that broke — gate the build, and the rest reports loudly.
      #
      # TODO: fix the 44, then fold tests/unit/ into the blocking tier.
      # ───────────────────────────────────────────────────────────────
      - name: Tests (blocking — auth + OAuth regression suites)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest \
            tests/unit/test_auth_signup_error_mapping.py \
            tests/unit/test_google_oauth_redirect.py \
            -q

      - name: Tests (advisory — full unit tier)
        run: |
          python -m pytest tests/unit/ -q --no-header 2>&1 | tail -25 || \
            echo "unit-tier failures above are the known backlog (advisory)"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # Deploy to Fly.io — runs ONLY on push to main, after ci passed
  # Requires: BIJOU_FLY_API_TOKEN in GitHub repo secrets
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Fly.io (bijou-production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy
        working-directory: packages/backend
        env:
          FLY_API_TOKEN: ${{ secrets.BIJOU_FLY_API_TOKEN }}
        run: |
          # NOTE (2026-08-09): removed --strategy bluegreen. fly.production.toml
          # already sets strategy = "immediate" (required for single-machine +
          # volume-mount). bluegreen deadlocks with `volume already claimed by
          # machine <id>` on this layout — verified by 2026-08-08 manual deploy.
          # Also explicitly export FLY_API_TOKEN so flyctl picks it up.
          # NOTE: do NOT add `flyctl auth whoami` here — deploy-scoped tokens
          # 401 on the metrics/auth endpoints but still work for `fly deploy`.
          # (verified 2026-08-09 on mybijouai-creator CI.)
          export FLY_API_TOKEN="${FLY_API_TOKEN}"
          flyctl deploy \
            --config fly.production.toml \
            --remote-only \
            --wait-timeout 300
