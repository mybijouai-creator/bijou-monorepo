name: landing

on:
  push:
    branches: [main]
    paths:
      - 'packages/landing/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'packages/landing/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/landing.yml'

# Cancel in-progress runs for the same branch when a new commit lands
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/landing/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Type check (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (npm run build)
        run: npm run build
        env:
          # Placeholders for the build step — real values come from Vercel
          VITE_PUBLIC_SITE_URL: 'https://mybijou.xyz'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: packages/landing/dist
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # DISABLED 2026-08-10 — the landing site now deploys through Vercel's
  # NATIVE git integration (project bijou-ai-digital-employee,
  # rootDirectory=packages/landing, production branch main).
  #
  # Keeping this job would give one Vercel project two competing deploy
  # paths; whichever finished last would win, so production could silently
  # flip between commits. The native integration also builds on Vercel's own
  # infrastructure, so it keeps working while GitHub Actions billing is
  # locked — the exact failure that hid a total signup outage.
  #
  # The `ci` job above still gates every push (tsc --noEmit + build).
  # To re-enable: delete `if: false` AND disable the git integration in the
  # Vercel dashboard first, or you get double deploys again.
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel (disabled — native git integration handles this)
    needs: ci
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@37.0.0  # pinned — see master AGENTS.md §9 don't-list

      - name: Pull Vercel env (build-time)
        run: vercel pull --yes --environment=production --token=${{ secrets.BIJOU_VERCEL_TOKEN }}
        working-directory: packages/landing

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.BIJOU_VERCEL_TOKEN }}
        working-directory: packages/landing

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.BIJOU_VERCEL_TOKEN }} --yes
        working-directory: packages/landing
        env:
          VERCEL_ORG_ID: ${{ secrets.BIJOU_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BIJOU_VERCEL_PROJECT_ID }}
