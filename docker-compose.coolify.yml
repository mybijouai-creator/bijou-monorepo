# Coolify docker-compose for Bijou AI monorepo
#
# Coolify reads this file to deploy the full stack as one "project"
# with multiple services. Each service maps to one Coolify "resource"
# with its own domain, env vars, and persistent volume.
#
# To use:
#   1. In Coolify UI: "+ New Resource" -> "Docker Compose"
#   2. Point it at this repo (GitHub: mybijouai-creator/bijou-monorepo)
#   3. Set Base Directory: /
#   4. Set Compose File: docker-compose.coolify.yml
#   5. Override env vars in Coolify UI (do NOT commit real secrets here)
#
# All env-var values shown here are placeholders. Copy
# ops/coolify/coolify.env.example to a Coolify env-group and fill in
# real values per environment (staging, prod, per-tenant bridge).
#
# This file is meant to be edited per environment, NOT committed with
# real secrets. The "env_file" reference below points to a file
# created by Coolify from the env-group; that file lives in
# /data/coolify/env/<group>/<service>.env and is gitignored.

# Compose file (no top-level `version:` key — it's been obsolete since
# the Docker Compose v2 plugin; omitting it avoids the warning)

x-common-env: &common-env
  # Supabase (shared across backend + voice)
  SUPABASE_URL: "${SUPABASE_URL:?required}"
  SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY:?required}"
  # Google AI
  GEMINI_API_KEY: "${GEMINI_API_KEY:?required}"
  # Canonical domain (the 2026-08-10 bug class — do not override with
  # stale Fly secrets)
  PUBLIC_URL: "https://app.mybijou.xyz"
  # Logging
  LOG_LEVEL: "INFO"
  # Sentry-style error tracking (optional)
  SENTRY_DSN: "${SENTRY_DSN:-}"

services:
  # ─── Backend (FastAPI, single multi-tenant instance) ──────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: bijou-backend:latest
    container_name: bijou-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      # Stripe
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?required}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?required}"
      # Email (magic links)
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # Cal.com (booking)
      CALCOM_CLIENT_ID: "${CALCOM_CLIENT_ID:-}"
      CALCOM_CLIENT_SECRET: "${CALCOM_CLIENT_SECRET:-}"
      # Nango (integrations)
      NANGO_SECRET_KEY: "${NANGO_SECRET_KEY:-}"
      # Langfuse (LLM observability — traces every ai:// call)
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://langfuse-web:3000}"
      LANGFUSE_ENVIRONMENT: "${LANGFUSE_ENVIRONMENT:-production}"
      LANGFUSE_SAMPLE_RATE: "${LANGFUSE_SAMPLE_RATE:-1.0}"
      LANGFUSE_MASK_PII: "${LANGFUSE_MASK_PII:-true}"
      LANGFUSE_RELEASE: "${LANGFUSE_RELEASE:-}"
      # Feature flags
      ENABLE_COMPOSIO: "false"
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      # Use the comprehensive self-test, not the trivial /health.
      # 503 here triggers Coolify's auto-rollback; 200 = system is healthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/self-test/summary"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─── Bridge (per-tenant) — one instance per tenant in production.
  # ─── For staging, a single bridge with a test tenant. ──────────────
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: bijou-bridge:latest
    container_name: bijou-bridge-staging
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      <<: *common-env
      # Bridge-specific
      BRIDGE_URL: "http://bridge:8080"
      BRIDGE_DB_PATH: "/data/bridge.db"
      # WhatsApp Web auth (per-tenant session storage in the volume)
      WHATSAPP_SESSION_PATH: "/data/whatsapp-session"
      # Webhook to backend
      BIJOU_BACKEND_URL: "http://backend:8080"
      BIJOU_BACKEND_API_KEY: "${BRIDGE_API_KEY:?required}"
    volumes:
      - bridge-data:/data
    healthcheck:
      test: ["CMD", "/app/bridge", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Landing preview (optional, for Coolify-hosted staging) ─────
  # The production landing lives on Vercel. This is a self-hosted
  # preview for when we want to test the React build without going
  # through Vercel (e.g., QA in the same network as the backend).
  landing-preview:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: bijou-landing:latest
    container_name: bijou-landing-preview
    restart: unless-stopped
    ports:
      - "3000:3000"
    profiles: ["preview"]  # only deploy with --profile preview

  # ─── Voice concierge (Telnyx, optional) ────────────────────────────
  # The voice service lands after the backend + bridge are healthy.
  # See packages/voice/AGENT.md for the design + A2A contract, and
  # issue #28 for the actual wiring work. Disabled by default — start
  # with the backend + bridge first, then `docker compose up voice` once
  # Telnyx keys are set.
  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    image: bijou-voice:latest
    container_name: bijou-voice
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      <<: *common-env
      # Voice-specific
      BIJOU_BACKEND_URL: "http://backend:8080"
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      TELNYX_PUBLIC_KEY: "${TELNYX_PUBLIC_KEY:-}"
      TELNYX_WEBHOOK_SECRET: "${TELNYX_WEBHOOK_SECRET:-}"
      VOICE_DEFAULT_VOICE: "${VOICE_DEFAULT_VOICE:-en-US-Neural2-A}"
      VOICE_MAX_CALL_SECONDS: "${VOICE_MAX_CALL_SECONDS:-900}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - backend
    profiles: ["voice"]  # only deploy with --profile voice

  # ─── Langfuse (LLM observability — self-hosted) ────────────────────
  # Langfuse v3 web + worker. Postgres + Clickhouse are the heavy stateful
  # deps. In production these should be external managed services
  # (Supabase, Neon, Clickhouse Cloud) — but for the initial Coolify
  # self-hosted deploy we run them as sibling services.
  #
  # First-time setup: after the stack is up, open
  #   https://<langfuse-domain>/auth/sign-up
  # create the org + project, copy the public+secret keys, then set
  # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY on the backend env group.
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: bijou-langfuse-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "clickhouse"
      REDIS_URL: "redis://langfuse-redis:6379"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-please-change-me-in-prod-32chars}"
      NEXTAUTH_URL: "${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}"
      SALT: "${LANGFUSE_SALT:-please-change-me-in-prod}"
      TELEMETRY_ENABLED: "false"
    depends_on:
      - langfuse-db
      - langfuse-clickhouse
      - langfuse-redis
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  langfuse-worker:
    image: langfuse/langfuse:3
    container_name: bijou-langfuse-worker
    restart: unless-stopped
    command: ["sh", "-c", "node ./worker.mjs"]
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "clickhouse"
      REDIS_URL: "redis://langfuse-redis:6379"
      TELEMETRY_ENABLED: "false"
    depends_on:
      - langfuse-web

  langfuse-db:
    image: postgres:16-alpine
    container_name: bijou-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: bijou-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: redis:7-alpine
    container_name: bijou-langfuse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-uploads:
    driver: local
  bridge-data:
    driver: local
  langfuse-db-data:
    driver: local
  langfuse-clickhouse-data:
    driver: local
  langfuse-redis-data:
    driver: local
